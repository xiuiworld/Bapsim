services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${BAPSIM_MQTT_BIND_IP:?Set the Windows LAN IPv4 address}:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../../local-data/a06/mosquitto:/mosquitto/data
