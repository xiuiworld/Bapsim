services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    container_name: bapsim-homeassistant
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PYTHONPATH: /bapsim
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./infrastructure/home_assistant/config:/config
      - ./domain:/bapsim/domain:ro
      - ./workflow:/bapsim/workflow:ro
      - ./service:/bapsim/service:ro
      - ./inputs:/bapsim/inputs:ro
