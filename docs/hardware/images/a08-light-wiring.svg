<polyline points="277,516 277,560" fill="none" stroke="#79502d" stroke-width="8" stroke-linejoin="round"/>
<text x="355" y="521" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="25" fill="#193047">10kΩ 저항</text>
<polyline points="230,562 230,678" fill="none" stroke="#43566a" stroke-width="4" stroke-linejoin="round"/>
<polyline points="230,678 840,678 840,629" fill="none" stroke="#43566a" stroke-width="4" stroke-linejoin="round"/>
<text x="480" y="691" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="23" fill="#43566a">GND — 센서 회로와 보드의 공통 접지</text>
<text x="40" y="751" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="24" fill="#193047">빛이 밝아지면 → 가운데 전압이 올라감 · 같은 회로 4개 사용</text>
<text x="40" y="792" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="20" fill="#4c6072">색은 그림 구분용입니다. 실제 점퍼선 색과 무관하게 연결 지점을 확인하세요.</text>
