<text x="471" y="430" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#4c6072">10kΩ 직렬 저항</text>
<rect x="720" y="305" width="240" height="333" rx="12" fill="#eaf2f7" stroke="#c8d3df" stroke-width="2"/>
<text x="840" y="324" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="28" fill="#193047">개발 보드</text>
