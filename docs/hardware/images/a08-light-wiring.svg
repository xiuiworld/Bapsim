<text x="199" y="250" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="24" fill="#193047">GL5528</text>
<text x="365" y="237" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="25" fill="#193047">빛을 받는 광센서</text>
<text x="365" y="274" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#4c6072">LED 앞에 붙일 부품</text>
