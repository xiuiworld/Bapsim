<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830">
<rect width="1000" height="830" fill="white"/>
<text x="40" y="28" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="34" fill="#193047">1. 광센서 하나 연결하기</text>
<text x="40" y="80" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="22" fill="#4c6072">연결 원리 그림 — 실제 보드·브레드보드 구멍 위치가 아닙니다.</text>
<text x="230" y="137" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Malgun Gothic, sans-serif" font-size="26" fill="#bc3f42">전원 VS</text>
<text x="440" y="143" dominant-baseline="text-before-edge" text-anchor="start" font-family="Malgun Gothic, sans-serif" font-size="21" fill="#4c6072">보드 입력 전압과 맞춘 전원 · 인출 위치 미확정</text>
