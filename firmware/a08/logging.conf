# Keep blocking minimal UART logging out of the 20 Hz acquisition loop.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_MINIMAL=n
CONFIG_LOG_PROCESS_THREAD=y
# Use the default lowest application priority for the log processing thread.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
# Keep the SDK's working shell transport; the UART-only trial emitted no A08 records.
# The stock 512-byte shell queue drops burst records despite steady acquisition.
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=8192
