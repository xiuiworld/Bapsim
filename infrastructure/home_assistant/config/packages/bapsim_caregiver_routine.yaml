  bapsim_routine_day_1_5:
    name: 1번째 사용 시간 토요일
  bapsim_routine_day_1_6:
    name: 1번째 사용 시간 일요일
  bapsim_routine_day_2_0:
    name: 2번째 사용 시간 월요일
  bapsim_routine_day_2_1:
    name: 2번째 사용 시간 화요일
  bapsim_routine_day_2_2:
    name: 2번째 사용 시간 수요일
  bapsim_routine_day_2_3:
    name: 2번째 사용 시간 목요일
  bapsim_routine_day_2_4:
    name: 2번째 사용 시간 금요일
  bapsim_routine_day_2_5:
    name: 2번째 사용 시간 토요일
  bapsim_routine_day_2_6:
    name: 2번째 사용 시간 일요일
  bapsim_routine_day_3_0:
    name: 3번째 사용 시간 월요일
  bapsim_routine_day_3_1:
    name: 3번째 사용 시간 화요일
  bapsim_routine_day_3_2:
    name: 3번째 사용 시간 수요일
  bapsim_routine_day_3_3:
    name: 3번째 사용 시간 목요일
  bapsim_routine_day_3_4:
