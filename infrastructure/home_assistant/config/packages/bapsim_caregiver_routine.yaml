automation:
  - id: bapsim_routine_remove_choices
    alias: 밥심 삭제할 사용 시간 목록 갱신
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.bapsim_initial_routine
    actions:
      - action: input_select.set_options
        target:
          entity_id: input_select.bapsim_routine_remove
        data:
          options: >-
            {% set ns = namespace(options=['선택 안 함']) %}
            {% set names = ['월','화','수','목','금','토','일'] %}
            {% for item in state_attr('sensor.bapsim_initial_routine', 'routines') or [] %}
              {% for w in item.windows %}
                {% set days = namespace(values=[]) %}
                {% for day in w.weekdays %}
                  {% set days.values = days.values + [names[day]] %}
                {% endfor %}
                {% set label = '매일' if w.weekdays | length == 7 else days.values | join('·') %}
                {% set ns.options = ns.options + [(ns.options | length) ~ '. ' ~ w.time ~ ' · ' ~ label] %}
              {% endfor %}
            {% endfor %}
            {{ ns.options }}

script:
  bapsim_prepare_pause_interval:
    alias: 생활 변화 알림을 지금부터 하루 쉬도록 설정
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bapsim_pause_from
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bapsim_control_until
        data:
          datetime: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d %H:%M:%S') }}"
  bapsim_prepare_control_until:
    alias: 알림 종료 시각을 내일로 설정
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.bapsim_control_until
        data:
          datetime: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d %H:%M:%S') }}"
