respond:
  name: 보호자 안부 확인 기록
  description: 선택한 안내에 대해 확인 중 또는 확인 완료를 기록합니다. 선택하지 않았을 때는 진행 중인 안내가 하나뿐이어야 합니다. 외부 분석 방식에서는 응답을 분석 서비스에 전달합니다.
  fields:
    response:
      required: true
      selector:
        select:
          options:
            - checking
            - resolved
    source:
      selector:
        text:
    device_id:
      selector:
        text:
    incident_id:
      description: 특정 안내 번호를 지정합니다. 비워 두면 화면에서 선택한 안내를 사용합니다.
      selector:
        text:
register_matter_contact:
  name: 실물 밥솥 뚜껑 센서 연결
  description: HA에 연결된 뚜껑 열림 센서를 밥솥 입력으로 등록합니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: binary_sensor
    on_is_open:
      required: true
      selector:
        boolean:
register_a05_snapshot:
  name: 보드 상태 보고 센서 연결
  description: 보드의 상태 보고 센서를 밥솥에 등록합니다. 시험 신호는 평소 사용 분석에 넣지 않으며, 별도 연결 시험에서만 확인할 수 있습니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
    matter_entry_id:
      required: true
      selector:
        text:
    node_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
unregister_a05_snapshot:
  name: 보드 상태 보고 센서 연결 해제
  description: 등록한 보드 상태 보고 센서의 연결을 해제하고 밥솥 입력을 사용할 수 없는 상태로 표시합니다.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
start_a05_connection_test:
  name: 보드→폰 연결 시험 시작
  description: 등록한 보드 하나와 시험 폰 하나로 최대 10분간 연결을 확인합니다. 뚜껑 시험은 새로운 닫힘·열림 신호가, 조리 단계 시험은 대기·취사·보온·판단 불가 신호가 순서대로 필요합니다. 폰 알림은 최대 한 번 요청하며 평소 사용 분석에는 반영하지 않습니다.
  fields:
    scenario:
      selector:
        select:
          options:
            - lid_connection
            - a07_phase_sequence
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
    phone_service:
      required: true
      selector:
        text:
stop_a05_connection_test:
  name: 보드→폰 연결 시험 종료
  description: 진행 중인 연결 시험을 즉시 종료합니다. 종료 후에는 시험 알림을 새로 요청하지 않습니다. 이미 HA가 수락한 알림 요청은 취소할 수 없습니다.
register_matter_cooking_state:
  name: 실물 밥솥 취사 센서 연결
  description: HA에 연결된 취사 상태 센서의 시작·완료 값을 밥솥 입력으로 등록합니다. 뚜껑 센서와 같은 밥솥 등록 이름을 사용하세요.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - select
    started_state:
      required: true
      selector:
        text:
    finished_state:
      required: true
      selector:
        text:
unregister_matter_input:
  name: 실물 밥솥 센서 연결 해제
  description: 장치나 HA 센서가 바뀌었을 때 뚜껑, 취사 또는 두 센서의 연결을 해제합니다. 해제한 입력은 연결 끊김으로 표시합니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    input_type:
      required: true
      selector:
        select:
          options:
            - lid
            - cooking
            - all
register_matter_context:
  name: 보조 센서 연결
  description: HA에 연결된 보조 센서의 원본 상태를 기록합니다. 밥솥 사용 판정은 변경하지 않습니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
    signal:
      required: true
      selector:
        text:
unregister_matter_context:
  name: 보조 센서 연결 해제
  description: 보조 센서 연결을 해제하고 해당 입력을 사용할 수 없는 상태로 기록합니다.
  fields:
    entity_id:
      required: true
      selector:
        entity:
register_matter_board_signal:
  name: 보드 관측·추정 신호 연결
  description: HA에 연결된 보드 신호 하나를 원본 그대로 기록합니다. 이 등록만으로 취사 여부를 추정하거나 사용 변화 판정을 바꾸지 않습니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
    kind:
      required: true
      selector:
        select:
          options:
            - observation
            - inference
    signal:
      required: true
      selector:
        text:
unregister_matter_board_signal:
  name: 보드 신호 연결 해제
  description: 보드 신호 하나의 연결을 해제하고 사용할 수 없는 상태로 기록합니다.
  fields:
    entity_id:
      required: true
      selector:
        entity:
set_notification_target:
  name: 보호자 휴대폰 알림 연결 설정
  description: 등록된 휴대폰 알림 서비스 이름을 입력합니다. 비워 두면 휴대폰 알림만 끄고 HA 내부 알림은 유지합니다.
  fields:
    service:
      selector:
        text:
test_pause_simulation_output:
  name: 가상 결과 갱신 잠시 멈추기
  description: 가상 분석 결과 카드와 전송 상태의 갱신을 지정한 시간 동안 멈춥니다. 분석과 실물 밥솥 결과는 계속 작동하며, 시간이 지나거나 HA를 다시 시작하면 자동으로 재개됩니다.
  fields:
    duration_seconds:
      required: true
      selector:
        number:
          min: 181
          max: 600
          mode: box
set_away:
  name: 외출 상태 설정
  description: 집에 있음 또는 외출 중으로 설정합니다. 외출 중에는 평소 사용 변화 알림을 보류하며, HA를 다시 시작해도 설정이 유지됩니다.
  fields:
    away:
      required: true
      selector:
        boolean:
set_initial_routine:
  name: 평소 밥솥 사용 시간 설정
  description: 밥솥 하나의 평소 집에서 쓰는 시각과 반복 요일을 설정합니다. 시각은 HH:MM 형식이며 요일은 월요일 0부터 일요일 6까지입니다. 요일을 생략하면 매일, 빈 목록이면 설정 삭제입니다. 초기 안내에도 실제 사용 기록과 연결 상태 확인이 필요합니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    windows:
      required: true
      example: '[{"time":"08:00","weekdays":[0,1,2,3,4,5,6]},{"time":"13:00","weekdays":[5,6]}]'
      selector:
        object:
dashboard_initial_routine:
  name: 보호자 화면의 사용 시간 저장
  description: 보호자 화면에서 고른 시각과 요일을 등록된 밥솥에 저장합니다. 기존 시간 설정을 대체합니다.
dashboard_add_routine:
  name: 평소 밥솥 사용 시간 추가
  description: 선택한 시각과 반복 요일을 등록된 밥솥의 기존 사용 시간에 추가합니다.
dashboard_remove_routine:
  name: 평소 밥솥 사용 시간 삭제
  description: 등록된 밥솥의 기존 사용 시간에서 선택한 항목을 삭제합니다.
set_notification_control:
  name: 알림 확인·쉬기 설정
  description: 진행 중인 안내를 종료 시각까지 확인 처리하거나, 지정한 기간에 사용 변화 알림을 쉬거나, 쉬기 설정을 취소합니다. 작업마다 새로운 명령 번호가 필요합니다.
  fields:
    command_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - acknowledge
            - pause_lifestyle
            - cancel_pause
    incident_id:
      selector:
        text:
    assessment_id:
      selector:
        text:
    pause_id:
      selector:
        text:
    starts_at:
      selector:
        text:
    ends_at:
      selector:
        text:
dashboard_control:
  name: 보호자 화면의 알림 설정 적용
  description: 보호자 화면에서 선택한 안내와 종료 시각으로 재알림을 보류하거나, 지정한 기간에 사용 변화 알림을 쉽니다.
  fields:
    action:
      required: true
      selector:
        select:
          options:
            - acknowledge
            - pause_lifestyle
            - cancel_pause
    pause_id:
      selector:
        text:
record_simulated_activity:
  name: 가상 보조 활동 기록
  description: 가상 입력 시험에만 쓰는 활동 기록을 추가합니다. 실물 밥솥 판정이나 실제 휴대폰 알림은 변경하지 않습니다.
  fields:
    device_id:
      required: true
      selector:
        text:
    signal:
      required: true
      selector:
        select:
          options:
            - door_opened
            - motion_detected
            - appliance_used
    at:
      selector:
        text:
