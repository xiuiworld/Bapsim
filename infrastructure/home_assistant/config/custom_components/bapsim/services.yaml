respond:
  name: Record caregiver response
  description: Record checking or resolved. With no source/device ID, use the only active incident; supply both if multiple are active.
  fields:
    response:
      required: true
      selector:
        select:
          options:
            - checking
            - resolved
    source:
      selector:
        text:
    device_id:
      selector:
        text:
register_matter_contact:
  name: Register Matter cooker contact
  description: Map a contact entity from the HA Matter integration to the same raw cooker event boundary as the simulator.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: binary_sensor
    on_is_open:
      required: true
      selector:
        boolean:
register_a05_snapshot:
  name: Register A05 atomic snapshot
  description: Bind the A05 ReportCounter sensor to a cooker after checking its Matter entry and node. Test-origin reports remain excluded from live analysis; an explicit bounded development test can process them separately.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
    matter_entry_id:
      required: true
      selector:
        text:
    node_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
unregister_a05_snapshot:
  name: Remove A05 atomic snapshot
  description: Remove an A05 snapshot binding and mark its cooker input unavailable.
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
start_a05_connection_test:
  name: Start one A05 board-to-phone development test
  description: Explicitly arm a ten-minute test-origin run for one registered A05 probe and one chosen test phone. Default requires fresh closed then open; a07_phase_sequence requires model-bearing inactive, cooking, warming, unknown reports. At most one mobile call. Live learning and alerts are unaffected.
  fields:
    scenario:
      selector:
        select:
          options:
            - lid_connection
            - a07_phase_sequence
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain: sensor
    phone_service:
      required: true
      selector:
        text:
stop_a05_connection_test:
  name: Stop A05 development test
  description: Disarm the current test immediately. No test phone call is made after stop; a call already accepted by HA cannot be recalled.
register_matter_cooking_state:
  name: Register Matter cooker cooking state
  description: Map two confirmed cooking values from an HA Matter entity to raw started/finished states. Use the same device_id as the lid contact.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
          domain:
            - sensor
            - binary_sensor
            - select
    started_state:
      required: true
      selector:
        text:
    finished_state:
      required: true
      selector:
        text:
unregister_matter_input:
  name: Remove Matter cooker input mapping
  description: Remove a logical cooker's lid, cooking, or both bindings when hardware or HA entities change. Removed inputs are marked offline.
  fields:
    device_id:
      required: true
      selector:
        text:
    input_type:
      required: true
      selector:
        select:
          options:
            - lid
            - cooking
            - all
register_matter_context:
  name: Register optional Matter context
  description: Forward a Matter entity's raw HA state to bapsim_context_raw_event. This does not change cooker detection.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
    signal:
      required: true
      selector:
        text:
unregister_matter_context:
  name: Remove optional Matter context
  description: Remove a context entity binding and publish an unavailable raw observation.
  fields:
    entity_id:
      required: true
      selector:
        entity:
register_matter_board_signal:
  name: Register Matter board observation or inference
  description: Preserve one HA Matter entity as a raw board signal. This does not infer cooking or change detection.
  fields:
    device_id:
      required: true
      selector:
        text:
    entity_id:
      required: true
      selector:
        entity:
    kind:
      required: true
      selector:
        select:
          options:
            - observation
            - inference
    signal:
      required: true
      selector:
        text:
unregister_matter_board_signal:
  name: Remove Matter board signal
  description: Remove one board signal mapping and record it as unavailable.
  fields:
    entity_id:
      required: true
      selector:
        entity:
set_notification_target:
  name: Set caregiver mobile notification service
  description: Supply a registered mobile_app_* service name (notify.mobile_app_* is also accepted), or leave empty to disable mobile delivery. Local HA notifications stay enabled.
  fields:
    service:
      selector:
        text:
test_pause_simulation_output:
  name: Pause simulation output for expiry test
  description: Temporarily stop refreshing only simulation result cards and MQTT state. Analysis and live output continue. Automatically resumes after the requested seconds or HA restart.
  fields:
    duration_seconds:
      required: true
      selector:
        number:
          min: 181
          max: 600
          mode: box
set_away:
  name: Set declared absence
  description: Mark the household as away or home. A declared absence pauses routine-change alerts and is saved across restarts.
  fields:
    away:
      required: true
      selector:
        boolean:
set_initial_routine:
  name: Set initial home cooker-use routine
  description: Set up to four KST home-use times for one cooker. Each window has time HH:MM and weekdays 0=Monday through 6=Sunday; omit weekdays for every day. To exclude routine weekday lunches away from home, omit those weekdays from that lunch window. An empty list clears the setting. Early alerts still require observed use and connection coverage.
  fields:
    device_id:
      required: true
      selector:
        text:
    windows:
      required: true
      example: '[{"time":"08:00","weekdays":[0,1,2,3,4,5,6]},{"time":"13:00","weekdays":[5,6]}]'
      selector:
        object:
set_notification_control:
  name: Set bounded notification control
  description: Acknowledge one active incident until an end time, pause lifestyle alerts for a period, or cancel a pause. Use a unique command_id for each action.
  fields:
    command_id:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - acknowledge
            - pause_lifestyle
            - cancel_pause
    incident_id:
      selector:
        text:
    assessment_id:
      selector:
        text:
    pause_id:
      selector:
        text:
    starts_at:
      selector:
        text:
    ends_at:
      selector:
        text:
dashboard_control:
  name: Apply caregiver dashboard control
  description: Use the dashboard end-time picker to acknowledge the sole active assessment or pause lifestyle alerts.
  fields:
    action:
      required: true
      selector:
        select:
          options:
            - acknowledge
            - pause_lifestyle
            - cancel_pause
    pause_id:
      selector:
        text:
record_simulated_activity:
  name: Record simulated auxiliary activity
  description: Add a virtual activity event for the simulator only. It never modifies the live Matter assessment or sends a real phone notification.
  fields:
    device_id:
      required: true
      selector:
        text:
    signal:
      required: true
      selector:
        select:
          options:
            - door_opened
            - motion_detected
            - appliance_used
    at:
      selector:
        text:
