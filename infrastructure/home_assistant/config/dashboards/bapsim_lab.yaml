title: 밥심 실험실
views:
  - title: 보호자
    path: status
    cards:
      - type: markdown
        content: |
          ## 밥솥 사용 확인
          {% set output = states('sensor.bapsim_output_state') %}
          {% set issue = states('sensor.bapsim_observation_issue_status') %}
          {% set observation = state_attr('sensor.bapsim_output_state', 'observation') %}
          {% set valid_until = state_attr('sensor.bapsim_output_state', 'valid_until') %}
          {% set current = output not in ['awaiting_matter', 'expired', 'unknown', 'unavailable', 'waiting'] and valid_until and as_timestamp(valid_until, 0) > as_timestamp(now()) %}
          {% set usable = current and observation in ['available', 'partial'] and issue not in ['disconnected', 'alert_requested', 'unknown', 'unavailable', 'not_observed'] %}
          {% set last_usage = state_attr('sensor.bapsim_output_state', 'last_usage_at') %}
          {% if issue in ['disconnected', 'alert_requested'] %}
          **연결 확인이 필요해요.** 밥솥의 현재 기록을 받을 수 없습니다.
          {% elif not usable %}
          **새 사용 기록을 기다리는 중이에요.** 지금은 평소와 비교할 수 없습니다.
          {% elif observation == 'partial' %}
          **일부 기록만 확인돼요.** 생활 변화를 판단하기 어렵습니다.
          {% else %}
          **최근 밥솥 기록을 확인했어요.**
          {% endif %}
          {% if usable and last_usage %}
          최근 사용 관련 기록: **{{ as_timestamp(last_usage) | timestamp_custom('%m월 %d일 %H:%M', true) }}**
          {% endif %}
          {% set assessments = state_attr('sensor.bapsim_output_state', 'assessments') or [] %}
          {% if usable and assessments %}
          {% for a in assessments[:1] %}
          최근 변화: **{{ {'usage_gap':'평소 시간대 사용 기록 없음', 'declining_usage':'최근 사용 감소'}.get(a.type, '사용 변화') }}** · {{ {'checking':'안부 확인 중', 'resolved':'확인 완료'}.get(a.get('caregiver_status'), '확인 필요') }}
          {% endfor %}
          {% endif %}
          {% set options = state_attr('input_select.bapsim_active_assessment', 'options') or [] %}
          {% if usable and options | length > 1 %}
          **확인할 안내가 있어요.** [안내 확인하기](/bapsim-lab/notice)
          {% elif usable %}
          현재 처리할 안내는 없습니다.
          {% else %}
          새 기록이 들어오면 이곳에 변화와 안내가 표시됩니다.
          {% endif %}
          {% if usable and state_attr('sensor.bapsim_output_state', 'initial_basis') %}
          현재는 입력한 사용 시간으로 비교 중입니다. 개인 기록을 모으는 중이에요.
          {% endif %}

          밥솥 사용 기록만으로 **식사 여부나 건강 상태는 알 수 없습니다.**
      - type: markdown
        content: |
          **필요한 작업**

          [평소 사용 시간 설정](/bapsim-lab/routine) · [특정 날짜 알림 쉬기](/bapsim-lab/travel) · [기록 자세히 보기](/bapsim-lab/details)

  - title: 안내 확인
    path: notice
    icon: mdi:bell-check
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 확인할 안내
          {% set options = state_attr('input_select.bapsim_active_assessment', 'options') or [] %}
          {% if options | length > 1 %}
          확인할 안내를 고른 뒤 실제 확인한 내용에 맞게 기록해 주세요.
          {% else %}
          **현재 처리할 안내가 없습니다.** 새 사용 변화가 확인되면 여기에 표시됩니다.
          {% endif %}
      - type: conditional
        conditions:
          - condition: template
            value_template: "{{ (state_attr('input_select.bapsim_active_assessment', 'options') or []) | length > 1 }}"
        card:
          type: entities
          title: 어떤 안내인가요?
          entities:
            - entity: input_select.bapsim_active_assessment
              name: 확인할 안내 선택
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: grid
          title: 안부 확인 기록
          columns: 2
          square: false
          cards:
            - type: button
              name: 안부 확인 중
              show_icon: false
              icon: mdi:account-search
              tap_action:
                action: perform-action
                perform_action: bapsim.respond
                data: {response: checking}
            - type: button
              name: 안부 확인 완료
              show_icon: false
              icon: mdi:check-circle
              tap_action:
                action: perform-action
                perform_action: bapsim.respond
                data: {response: resolved}
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: markdown
          content: |
            ### 나중에 다시 알림받기
            아래 시각까지 선택한 안내의 재알림을 보류합니다. **안부 확인 완료를 뜻하지 않습니다.**
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: button
          name: 재알림 시각을 내일로 설정
          show_icon: false
          icon: mdi:calendar-today
          tap_action:
            action: perform-action
            perform_action: script.bapsim_prepare_control_until
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: entities
          entities:
            - entity: input_datetime.bapsim_control_until
              name: 다시 알림받을 시각
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) <= as_timestamp(now()) }}"
        card:
          type: markdown
          content: 종료 시각이 지났습니다. 위 버튼으로 내일을 선택하거나 미래 시각을 입력해 주세요.
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) > as_timestamp(now()) }}"
        card:
          type: button
          name: 이 시각까지 재알림 보류
          show_icon: false
          icon: mdi:bell-sleep
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_control
            data: {action: acknowledge}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.bapsim_notification_control_result
            state: [accepted, rejected, failed, submitted, applying]
        card:
          type: markdown
          content: |
            {% set result = states('sensor.bapsim_notification_control_result') %}
            **최근 알림 조작:** {{ '적용됨' if result == 'accepted' else '처리 중' if result in ['submitted', 'applying'] else '적용되지 않음 · 안내와 시각을 확인해 주세요' }}

  - title: 알림 쉬기
    path: travel
    icon: mdi:bell-sleep
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 특정 기간 알림 쉬기
          외출하거나 평소와 달리 밥솥을 쓰지 않을 기간에 **생활 변화 알림**을 쉽니다. 시작과 종료 시각을 고르세요. 시작 시각이 지났으면 저장한 때부터 적용됩니다. 안전 확인이나 밥솥 연결 알림을 끄는 기능은 아닙니다.
      - type: button
        name: 오늘~내일 시각 자동 입력
        show_icon: false
        icon: mdi:calendar-today
        tap_action:
          action: perform-action
          perform_action: script.bapsim_prepare_pause_interval
      - type: entities
        entities:
          - entity: input_datetime.bapsim_pause_from
            name: 시작
          - entity: input_datetime.bapsim_control_until
            name: 종료
      - type: conditional
        conditions:
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) <= as_timestamp(now()) or as_timestamp(states('input_datetime.bapsim_pause_from'), 0) == 0 or as_timestamp(states('input_datetime.bapsim_pause_from'), 0) >= as_timestamp(states('input_datetime.bapsim_control_until'), 0) }}"
        card:
          type: markdown
          content: 종료 시각은 미래로, 시작 시각은 종료보다 앞으로 정해 주세요.
      - type: conditional
        conditions:
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) > as_timestamp(now()) and as_timestamp(states('input_datetime.bapsim_pause_from'), 0) > 0 and as_timestamp(states('input_datetime.bapsim_pause_from'), 0) < as_timestamp(states('input_datetime.bapsim_control_until'), 0) }}"
        card:
          type: button
          name: 선택한 기간에 생활 변화 알림 쉬기
          show_icon: false
          icon: mdi:bell-sleep
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_control
            data: {action: pause_lifestyle}
      - type: markdown
        content: |
          ## 설정한 알림 쉬기
          {% set pauses = state_attr('sensor.bapsim_notification_controls', 'pauses') or {} %}
          {% set present = namespace(count=0) %}
          {% for pause in pauses.values() | sort(attribute='starts_at') %}
          {% if as_timestamp(pause.ends_at, 0) > as_timestamp(now()) %}
          {% set present.count = present.count + 1 %}
          - **쉬기 {{ present.count }} · {{ '진행 중' if as_timestamp(pause.starts_at, 0) <= as_timestamp(now()) else '예정' }}** · {{ as_timestamp(pause.starts_at) | timestamp_custom('%m월 %d일 %H:%M', true) }} ~ {{ as_timestamp(pause.ends_at) | timestamp_custom('%m월 %d일 %H:%M', true) }}
          {% endif %}
          {% endfor %}
          {% if present.count == 0 %}
          예정되거나 진행 중인 알림 쉬기가 없습니다.
          {% else %}
          취소하려면 아래에서 기간을 고른 뒤 **선택한 알림 쉬기 취소**를 누르세요.
          {% endif %}

          {% set past = namespace(count=0) %}
          {% for pause in pauses.values() | sort(attribute='ends_at', reverse=true) %}
          {% if as_timestamp(pause.ends_at, 0) <= as_timestamp(now()) and past.count < 3 %}
          {% if past.count == 0 %}**지난 쉬기 · 최근 3건**{% endif %}
          {% set past.count = past.count + 1 %}
          - {{ as_timestamp(pause.starts_at) | timestamp_custom('%m월 %d일 %H:%M', true) }} ~ {{ as_timestamp(pause.ends_at) | timestamp_custom('%m월 %d일 %H:%M', true) }}
          {% endif %}
          {% endfor %}
      - type: conditional
        conditions:
          - condition: template
            value_template: "{{ (state_attr('input_select.bapsim_active_pause', 'options') or []) | count > 1 }}"
        card:
          type: entities
          title: 취소할 알림 쉬기 선택
          entities:
            - input_select.bapsim_active_pause
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_pause
            state_not: [선택, unknown, unavailable]
        card:
          type: button
          name: 선택한 알림 쉬기 취소
          show_icon: false
          icon: mdi:bell-cancel-outline
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_control
            data: {action: cancel_pause}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.bapsim_notification_control_result
            state: [accepted, rejected, failed, submitted, applying]
        card:
          type: markdown
          content: |
            {% set result = states('sensor.bapsim_notification_control_result') %}
            **최근 조작:** {{ '적용됨' if result == 'accepted' else '처리 중' if result in ['submitted', 'applying'] else '적용되지 않음 · 종료 시각을 확인해 주세요' }}

  - title: 자세한 기록
    path: details
    icon: mdi:text-box-search
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 기록 자세히 보기
          밥솥의 뚜껑 열림·취사 기록으로 **실제 식사나 건강 상태는 확인할 수 없습니다.**
          {% set output = states('sensor.bapsim_output_state') %}
          {% set issue = states('sensor.bapsim_observation_issue_status') %}
          {% if output in ['awaiting_matter', 'expired', 'unknown', 'unavailable', 'waiting'] %}
          **현재 실물 사용 기록이 부족합니다.** 새 기록이 들어오면 평소와 비교합니다.
          {% else %}
          **최근 밥솥 기록:** {{ as_timestamp(state_attr('sensor.bapsim_output_state', 'last_usage_at'), 0) | timestamp_custom('%m월 %d일 %H:%M', true) if state_attr('sensor.bapsim_output_state', 'last_usage_at') else '사용 시각을 확인할 수 없음' }}
          {% endif %}
          **연결 상태:** {{ {'available':'연결됨', 'partial':'일부 기록만 확인됨', 'disconnected':'연결 끊김', 'alert_requested':'연결 확인 필요', 'not_observed':'아직 확인할 기록 없음'}.get(issue, '확인할 수 없음') }}
          {% set baseline = states('sensor.bapsim_baseline') %}
          **개인 비교 기준:** {{ {'ready':'평소 패턴과 비교 가능', 'learning':'평소 패턴을 모으는 중', 'waiting':'비교할 기록 부족', 'not_observed':'비교할 기록 부족'}.get(baseline, '확인할 수 없음') }}
          {% set context = states('sensor.bapsim_usage_context') %}
          {% if context not in ['waiting', 'unknown', 'unavailable'] %}
          **최근 뚜껑 열림:** {{ {'warming_possible_use':'보온 중 열림', 'recent_cooking_possible_use':'취사 후 열림', 'unclassified_open':'열림 · 용도 알 수 없음'}.get(context, '용도 알 수 없음') }}
          {% endif %}
          {% set f = states.sensor.bapsim_features.attributes if states.sensor.bapsim_features is defined else {} %}
          {% if f.get('cook_count_24h') is not none %}
          **최근 24시간 취사 기록:** {{ f.get('cook_count_24h') }}회
          {% endif %}

  - title: 사용 시간 설정
    path: routine
    icon: mdi:calendar-clock
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 평소 밥솥 사용 시간
          평소 밥솥을 사용하는 시간과 **매주 반복할 요일**을 고르세요. 월·수·금처럼 다르면 ‘요일 직접 선택’을 고르세요. **저장하면 이전 설정을 모두 바꿉니다.**
          적용하려면 실물 밥솥이 한 대 연결되어 있어야 합니다.
          특정 날짜에 밥솥을 쓰지 않을 예정이라면 [알림 쉬기](/bapsim-lab/travel)에서 시작·종료 시각을 정하세요.
          {% set routines = state_attr('sensor.bapsim_initial_routine', 'routines') or [] %}
          {% if routines %}
          **현재 적용된 시간**
          {% for item in routines %}
          {% for w in item.windows %}
          {% set label = namespace(days=[]) %}
          {% for day in w.weekdays %}
          {% set label.days = label.days + [['월','화','수','목','금','토','일'][day]] %}
          {% endfor %}
          - {{ w.time }} · {{ '매일' if w.weekdays | length == 7 else label.days | join('·') }}
          {% endfor %}
          {% endfor %}
          {% else %}
          **현재 적용된 시간이 없습니다.**
          {% endif %}
      - type: entities
        title: 첫 번째 시간
        entities:
          - entity: input_datetime.bapsim_routine_time_1
            name: 시간
          - entity: input_select.bapsim_routine_days_1
            name: 요일
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_routine_days_1
            state: 요일 직접 선택
        card:
          type: grid
          title: 첫 번째 시간 · 반복할 요일
          columns: 7
          square: false
          cards:
            - type: button
              entity: input_boolean.bapsim_routine_day_1_0
              name: 월
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_1
              name: 화
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_2
              name: 수
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_3
              name: 목
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_4
              name: 금
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_5
              name: 토
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_6
              name: 일
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: input_select.bapsim_routine_days_1
                state_not: [사용 안 함, unknown, unavailable]
              - condition: state
                entity: input_select.bapsim_routine_days_2
                state_not: [사용 안 함, unknown, unavailable]
        card:
          type: entities
          title: 두 번째 시간
          entities:
            - entity: input_datetime.bapsim_routine_time_2
              name: 시간
            - entity: input_select.bapsim_routine_days_2
              name: 요일
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_routine_days_2
            state: 요일 직접 선택
        card:
          type: grid
          title: 두 번째 시간 · 반복할 요일
          columns: 7
          square: false
          cards:
            - type: button
              entity: input_boolean.bapsim_routine_day_2_0
              name: 월
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_2_1
              name: 화
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_2_2
              name: 수
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_2_3
              name: 목
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_2_4
              name: 금
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_2_5
              name: 토
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_2_6
              name: 일
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: input_select.bapsim_routine_days_2
                state_not: [사용 안 함, unknown, unavailable]
              - condition: state
                entity: input_select.bapsim_routine_days_3
                state_not: [사용 안 함, unknown, unavailable]
        card:
          type: entities
          title: 세 번째 시간
          entities:
            - entity: input_datetime.bapsim_routine_time_3
              name: 시간
            - entity: input_select.bapsim_routine_days_3
              name: 요일
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_routine_days_3
            state: 요일 직접 선택
        card:
          type: grid
          title: 세 번째 시간 · 반복할 요일
          columns: 7
          square: false
          cards:
            - type: button
              entity: input_boolean.bapsim_routine_day_3_0
              name: 월
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_3_1
              name: 화
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_3_2
              name: 수
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_3_3
              name: 목
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_3_4
              name: 금
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_3_5
              name: 토
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_3_6
              name: 일
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: input_select.bapsim_routine_days_3
                state_not: [사용 안 함, unknown, unavailable]
              - condition: state
                entity: input_select.bapsim_routine_days_4
                state_not: [사용 안 함, unknown, unavailable]
        card:
          type: entities
          title: 네 번째 시간
          entities:
            - entity: input_datetime.bapsim_routine_time_4
              name: 시간
            - entity: input_select.bapsim_routine_days_4
              name: 요일
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_routine_days_4
            state: 요일 직접 선택
        card:
          type: grid
          title: 네 번째 시간 · 반복할 요일
          columns: 7
          square: false
          cards:
            - type: button
              entity: input_boolean.bapsim_routine_day_4_0
              name: 월
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_4_1
              name: 화
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_4_2
              name: 수
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_4_3
              name: 목
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_4_4
              name: 금
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_4_5
              name: 토
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_4_6
              name: 일
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
      - type: markdown
        content: |
          {% set ns = namespace(chosen=[], incomplete=false) %}
          {% for i in range(1, 5) %}
          {% set days = states('input_select.bapsim_routine_days_' ~ i) %}
          {% if days == '요일 직접 선택' %}
          {% set selected = namespace(names=[]) %}
          {% for day in range(7) %}
          {% if is_state('input_boolean.bapsim_routine_day_' ~ i ~ '_' ~ day, 'on') %}
          {% set selected.names = selected.names + [['월','화','수','목','금','토','일'][day]] %}
          {% endif %}
          {% endfor %}
          {% if selected.names %}
          {% set ns.chosen = ns.chosen + [selected.names | join('·') ~ ' ' ~ states('input_datetime.bapsim_routine_time_' ~ i)[:5]] %}
          {% else %}
          {% set ns.incomplete = true %}
          {% endif %}
          {% elif days not in ['사용 안 함', 'unknown', 'unavailable'] %}
          {% set ns.chosen = ns.chosen + [days ~ ' ' ~ states('input_datetime.bapsim_routine_time_' ~ i)[:5]] %}
          {% endif %}
          {% endfor %}
          {% if ns.incomplete %}
          **‘요일 직접 선택’에서 반복할 요일을 하나 이상 눌러 주세요.**
          {% endif %}
          {% if ns.chosen %}
          **저장 전 입력:** {{ ns.chosen | join(' · ') }}
          {% elif not ns.incomplete %}
          **요일을 하나 이상 선택해 주세요.** 시간과 요일을 고른 뒤 적용할 수 있습니다.
          {% endif %}
      - type: conditional
        conditions:
          - condition: template
            value_template: >-
              {% set result = namespace(any=false, valid=true) %}
              {% for i in range(1, 5) %}
                {% set days = states('input_select.bapsim_routine_days_' ~ i) %}
                {% if days == '요일 직접 선택' %}
                  {% set selected = namespace(any=false) %}
                  {% for day in range(7) %}
                    {% if is_state('input_boolean.bapsim_routine_day_' ~ i ~ '_' ~ day, 'on') %}
                      {% set selected.any = true %}
                    {% endif %}
                  {% endfor %}
                  {% if selected.any %}{% set result.any = true %}
                  {% else %}{% set result.valid = false %}{% endif %}
                {% elif days in ['매일', '평일', '주말'] %}
                  {% set result.any = true %}
                {% endif %}
              {% endfor %}
              {{ result.any and result.valid }}
        card:
          type: button
          name: 이 시간으로 적용
          show_icon: false
          icon: mdi:content-save-check
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_initial_routine
      - type: markdown
        content: |
          {% set result = states('sensor.bapsim_initial_routine_result') %}
          {% if result == 'applied' %}
          **적용됨.** 위의 현재 적용된 시간을 확인해 주세요.
          {% elif result == 'failed' %}
          **적용되지 않음.** 입력과 밥솥 연결을 확인해 주세요.
          {% endif %}
          사용 시간은 식사 여부나 건강 상태를 확인하는 설정이 아닙니다.
  - title: Simulator
    path: simulator
    icon: mdi:rice
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 밥솥 시뮬레이터
          버튼은 원시 상태와 `bapsim_raw_event`만 만듭니다. 실제 식사 여부나 이상 여부를 판정하지 않습니다.
      - type: grid
        title: 이벤트 발생
        columns: 2
        square: false
        cards:
          - type: button
            name: 뚜껑 열기
            icon: mdi:pot-steam
            tap_action: {action: perform-action, perform_action: script.bapsim_lid_open}
          - type: button
            name: 뚜껑 닫기
            icon: mdi:pot
            tap_action: {action: perform-action, perform_action: script.bapsim_lid_close}
          - type: button
            name: 취사 시작
            icon: mdi:play
            tap_action: {action: perform-action, perform_action: script.bapsim_cooking_start}
          - type: button
            name: 취사 완료
            icon: mdi:check
            tap_action: {action: perform-action, perform_action: script.bapsim_cooking_finish}
          - type: button
            name: 통신 끊기
            icon: mdi:lan-disconnect
            tap_action: {action: perform-action, perform_action: script.bapsim_disconnect}
          - type: button
            name: 통신 복구
            icon: mdi:lan-connect
            tap_action: {action: perform-action, perform_action: script.bapsim_reconnect}
          - type: button
            name: 외출 시작
            icon: mdi:exit-run
            tap_action: {action: perform-action, perform_action: script.bapsim_away_start}
          - type: button
            name: 외출 종료
            icon: mdi:home-import-outline
            tap_action: {action: perform-action, perform_action: script.bapsim_away_end}
      - type: entities
        title: 현재 원시 상태
        entities:
          - input_select.bapsim_lid_state
          - input_select.bapsim_cooking_state
          - input_select.bapsim_availability
          - input_select.bapsim_away_state
      - type: history-graph
        title: 최근 상태 변화
        hours_to_show: 24
        entities:
          - input_select.bapsim_lid_state
          - input_select.bapsim_cooking_state
          - input_select.bapsim_availability
          - input_select.bapsim_away_state
      - type: entities
        title: 시뮬레이션 분석 결과
        entities:
          - sensor.bapsim_simulation_output_state
          - sensor.bapsim_simulation_baseline
          - sensor.bapsim_simulation_features
          - sensor.bapsim_simulation_detection_status
          - sensor.bapsim_simulation_workflow_status
          - sensor.bapsim_simulation_notification_delivery
  - title: A05 연결 시험
    path: a05-test
    icon: mdi:test-tube
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 개발용 연결 시험
          실제 A05 보드의 닫힘→열림을 확인하는 1회 시험입니다. 개인 학습·AI 판정 결과가 아닙니다.
          실행 ID와 계약 기록 ID를 아래 카드에서 확인하세요. 휴대폰 수신 여부는 별도로 확인해야 합니다.
      - type: entities
        title: 현재 시험 실행
        entities:
          - entity: sensor.bapsim_a05_connection_test
            name: A05 보드→B→시험 폰
      - type: markdown
        content: |
          {% set a = states.sensor.bapsim_a05_connection_test.attributes if states.sensor.bapsim_a05_connection_test is defined else {} %}
          - 단계: **{{ states('sensor.bapsim_a05_connection_test') }}**
          - 실행 ID: `{{ a.get('test_run_id', '없음') }}`
          - 보드: `{{ a.get('device_id', '없음') }}` / 입력: `{{ a.get('source_ref', '없음') }}`
          - 닫힘 계약 기록: `{{ a.get('closed_record_id', '대기') }}`
          {% set r = a.get('result') or {} %}
          - 열림 계약 기록: `{{ r.get('opened_record_id', '대기') }}`
          - 실행 시나리오: `{{ a.get('scenario', '대기') }}`
          {% for item in a.get('phase_evidence', []) %}
          - A07 {{ item.phase }}: `{{ item.record_id }}` · 보고 {{ item.report_counter }} · 품질 {{ item.quality }}
          {% endfor %}
          - A07 모델 버전: `{{ r.get('model_version', '대기') }}`
          - 알림 호출 시도: **{{ a.get('mobile_attempted', false) }}**
          - HA 알림 서비스가 요청을 받았다는 상태는 실제 폰 수신 증거가 아닙니다.
  - title: 진단
    path: diagnostics
    icon: mdi:stethoscope
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 내부 진단
          실물 입력과 처리 단계를 확인하는 개발용 화면입니다. 시뮬레이션은 Simulator 탭에서 확인합니다.
      - type: entities
        title: 실물 입력·판정 내부 상태
        entities:
          - sensor.bapsim_output_state
          - sensor.bapsim_observation_issue_status
          - sensor.bapsim_baseline
          - sensor.bapsim_usage_context
          - sensor.bapsim_detection_status
          - sensor.bapsim_decline_detection
          - sensor.bapsim_interval_detection
          - sensor.bapsim_features
          - sensor.bapsim_mqtt_output
          - sensor.bapsim_auxiliary_deferral
          - sensor.bapsim_matter_input
          - sensor.bapsim_away
          - sensor.bapsim_workflow_status
          - sensor.bapsim_decline_status
          - sensor.bapsim_notification_delivery
          - sensor.bapsim_notification_controls
          - sensor.bapsim_notification_control_result
          - input_select.bapsim_availability
      - type: history-graph
        title: 최근 7일 판정·응답 기록
        hours_to_show: 168
        entities:
          - sensor.bapsim_detection_status
          - sensor.bapsim_workflow_status
          - sensor.bapsim_decline_status
