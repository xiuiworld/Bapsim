title: 밥심 실험실
views:
  - title: 보호자
    path: status
    icon: mdi:heart-pulse
    cards:
      - type: markdown
        content: |
          ## 밥솥 사용 확인
          {% set output = states('sensor.bapsim_output_state') %}
          {% set issue = states('sensor.bapsim_observation_issue_status') %}
          {% set observation = state_attr('sensor.bapsim_output_state', 'observation') %}
          {% set valid_until = state_attr('sensor.bapsim_output_state', 'valid_until') %}
          {% set current = output not in ['awaiting_matter', 'expired', 'unknown', 'unavailable', 'waiting'] and valid_until and as_timestamp(valid_until, 0) > as_timestamp(now()) %}
          {% set usable = current and observation in ['available', 'partial'] and issue not in ['disconnected', 'alert_requested', 'unknown', 'unavailable', 'not_observed'] %}
          {% set last_usage = state_attr('sensor.bapsim_output_state', 'last_usage_at') %}
          {% if issue in ['disconnected', 'alert_requested'] %}
          **연결 확인이 필요해요.** 밥솥의 현재 기록을 받을 수 없습니다.
          {% elif not usable %}
          **새 사용 기록을 기다리는 중이에요.** 지금은 평소와 비교할 수 없습니다.
          {% elif observation == 'partial' %}
          **일부 기록만 확인돼요.** 생활 변화를 판단하기 어렵습니다.
          {% else %}
          **최근 밥솥 기록을 확인했어요.**
          {% endif %}
          {% if usable and last_usage %}
          {% set elapsed_minutes = ((as_timestamp(now()) - as_timestamp(last_usage)) / 60) | int %}
          마지막 밥솥 사용: **{{ as_timestamp(last_usage) | timestamp_custom('%m월 %d일 %H:%M', true) }}**{% if elapsed_minutes >= 0 %} · **{% if elapsed_minutes >= 1440 %}{{ elapsed_minutes // 1440 }}일 {% endif %}{% if elapsed_minutes >= 60 %}{{ (elapsed_minutes % 1440) // 60 }}시간 {% endif %}{{ elapsed_minutes % 60 }}분 전**{% endif %}
          {% elif usable %}
          아직 확인된 밥솥 사용 시각이 없습니다.
          {% endif %}
          {% if usable %}
          {% set routines = state_attr('sensor.bapsim_initial_routine', 'routines') or [] %}
          {% set chosen = namespace(times=[]) %}
          {% for item in routines %}
          {% for w in item.windows %}
          {% if now().weekday() in w.weekdays %}
          {% set chosen.times = chosen.times + [w.time] %}
          {% endif %}
          {% endfor %}
          {% endfor %}
          {% if routines %}
          {% if chosen.times %}
          오늘 설정한 평소 사용 시간: **{{ chosen.times | sort | join(' · ') }}**
          {% else %}
          오늘은 설정된 평소 사용 시간이 없습니다.
          {% endif %}
          {% elif is_state('sensor.bapsim_baseline', 'ready') and 0 <= as_timestamp(now()) - as_timestamp(state_attr('sensor.bapsim_baseline', 'as_of'), 0) < 7200 %}
          {% set learned = namespace(times=[]) %}
          {% for w in state_attr('sensor.bapsim_baseline', 'windows') or [] %}
          {% if w.covered_days >= 7 and w.positive_days >= 5 and w.probability >= 0.72 and not w.schedule_excluded %}
          {% set learned.times = learned.times + [as_timestamp(w.expected_time) | timestamp_custom('%H:%M', true)] %}
          {% endif %}
          {% endfor %}
          {% if learned.times %}
          기록에서 추정한 오늘의 평소 사용 시간: **{{ learned.times | sort | join(' · ') }}**
          {% else %}
          평소 사용 시간은 기록을 더 모으는 중입니다.
          {% endif %}
          {% else %}
          평소 사용 시간은 기록을 더 모으는 중입니다. [직접 설정하기](/bapsim-lab/routine)
          {% endif %}
          {% endif %}
          {% set assessments = state_attr('sensor.bapsim_output_state', 'assessments') or [] %}
          {% if usable and assessments %}
          {% for a in assessments[:1] %}
          최근 변화: **{{ {'usage_gap':'평소 시간대 사용 기록 없음', 'declining_usage':'최근 사용 감소'}.get(a.type, '사용 변화') }}** · {{ {'checking':'안부 확인 중', 'resolved':'확인 완료'}.get(a.get('caregiver_status'), '확인 필요') }}
          {% endfor %}
          {% endif %}
          {% set options = state_attr('input_select.bapsim_active_assessment', 'options') or [] %}
          {% if usable and options | length > 1 %}
          **확인할 안내가 있어요.** [안내 확인하기](/bapsim-lab/notice)
          {% elif usable %}
          현재 처리할 안내는 없습니다.
          {% else %}
          새 기록이 들어오면 이곳에 변화와 안내가 표시됩니다.
          {% endif %}
          {% if usable and state_attr('sensor.bapsim_output_state', 'initial_basis') %}
          현재는 입력한 사용 시간으로 비교 중입니다. 개인 기록을 모으는 중이에요.
          {% endif %}

          밥솥 사용 기록에서 평소와 다른 생활 흐름을 유추해 안부 확인을 돕습니다. 실제 식사·건강 상태는 직접 확인이 필요합니다.
      - type: markdown
        content: |
          **필요한 작업**

          [평소 사용 시간 설정](/bapsim-lab/routine) · [특정 날짜 알림 쉬기](/bapsim-lab/travel) · [기록 자세히 보기](/bapsim-lab/details)

  - title: 안내 확인
    path: notice
    icon: mdi:bell-check
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 확인할 안내
          {% set options = state_attr('input_select.bapsim_active_assessment', 'options') or [] %}
          {% if options | length > 1 %}
          확인할 안내를 고른 뒤 실제 확인한 내용에 맞게 기록해 주세요.
          {% else %}
          **현재 처리할 안내가 없습니다.** 새 사용 변화가 확인되면 여기에 표시됩니다.
          {% endif %}
      - type: conditional
        conditions:
          - condition: template
            value_template: "{{ (state_attr('input_select.bapsim_active_assessment', 'options') or []) | length > 1 }}"
        card:
          type: entities
          title: 어떤 안내인가요?
          entities:
            - entity: input_select.bapsim_active_assessment
              name: 확인할 안내 선택
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: grid
          title: 안부 확인 기록
          columns: 2
          square: false
          cards:
            - type: button
              name: 안부 확인 중
              show_icon: false
              icon: mdi:account-search
              tap_action:
                action: perform-action
                perform_action: bapsim.respond
                data: {response: checking}
            - type: button
              name: 안부 확인 완료
              show_icon: false
              icon: mdi:check-circle
              tap_action:
                action: perform-action
                perform_action: bapsim.respond
                data: {response: resolved}
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: markdown
          content: |
            ### 나중에 다시 알림받기
            아래 시각까지 선택한 안내의 재알림을 보류합니다. **안부 확인 완료를 뜻하지 않습니다.**
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: button
          name: 재알림 시각을 내일로 설정
          show_icon: false
          icon: mdi:calendar-today
          tap_action:
            action: perform-action
            perform_action: script.bapsim_prepare_control_until
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: entities
          entities:
            - entity: input_datetime.bapsim_control_until
              name: 다시 알림받을 시각
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) <= as_timestamp(now()) }}"
        card:
          type: markdown
          content: 종료 시각이 지났습니다. 위 버튼으로 내일을 선택하거나 미래 시각을 입력해 주세요.
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) > as_timestamp(now()) }}"
        card:
          type: button
          name: 이 시각까지 재알림 보류
          show_icon: false
          icon: mdi:bell-sleep
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_control
            data: {action: acknowledge}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.bapsim_notification_control_result
            state: [accepted, rejected, failed, submitted, applying]
        card:
          type: markdown
          content: |
            {% set result = states('sensor.bapsim_notification_control_result') %}
            **최근 알림 조작:** {{ '적용됨' if result == 'accepted' else '처리 중' if result in ['submitted', 'applying'] else '적용되지 않음 · 안내와 시각을 확인해 주세요' }}

  - title: 알림 쉬기
    path: travel
    icon: mdi:bell-sleep
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 저장된 알림 쉬기
              {% set pauses = state_attr('sensor.bapsim_notification_controls', 'pauses') or {} %}
              {% set present = namespace(count=0) %}
              {% for pause in pauses.values() | sort(attribute='starts_at') %}
              {% if as_timestamp(pause.ends_at, 0) > as_timestamp(now()) %}
              {% set present.count = present.count + 1 %}
              **{{ present.count }}번 · {{ '진행 중' if as_timestamp(pause.starts_at, 0) <= as_timestamp(now()) else '예정' }}**\
              {{ as_timestamp(pause.starts_at) | timestamp_custom('%m/%d %H:%M', true) }} → {{ as_timestamp(pause.ends_at) | timestamp_custom('%m/%d %H:%M', true) }}
              {% endif %}
              {% endfor %}
              {% if present.count == 0 %}
              진행 중이거나 예정된 쉬기 기간이 없어요.
              {% endif %}
          - type: entities
            title: 저장된 설정 삭제
            entities:
              - entity: input_select.bapsim_active_pause
                name: 삭제할 기간 선택
          - type: markdown
            content: |
              {% set options = state_attr('input_select.bapsim_active_pause', 'options') or [] %}
              {% if options | length <= 1 %}
              삭제할 쉬기 설정이 없어요. 새 기간을 저장하면 여기에서 삭제할 수 있습니다.
              {% elif states('input_select.bapsim_active_pause') in ['선택', 'unknown', 'unavailable'] %}
              위에서 삭제할 기간을 선택해 주세요.
              {% else %}
              선택한 기간을 아래 버튼으로 삭제할 수 있습니다.
              {% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.bapsim_active_pause
                state_not: [선택, unknown, unavailable]
            card:
              type: button
              name: 선택한 설정 삭제
              show_icon: false
              icon: mdi:delete-outline
              tap_action:
                action: perform-action
                perform_action: bapsim.dashboard_control
                data: {action: cancel_pause}
                confirmation:
                  title: 알림 쉬기 삭제
                  text: 선택한 쉬기 기간을 삭제할까요? 다른 쉬기 설정은 유지됩니다.
                  confirm_text: 삭제
                  dismiss_text: 돌아가기
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.bapsim_notification_control_result
                state: [accepted, rejected, failed, submitted, applying]
            card:
              type: markdown
              content: |
                {% set result = states('sensor.bapsim_notification_control_result') %}
                **최근 조작:** {{ '적용됨' if result == 'accepted' else '처리 중' if result in ['submitted', 'applying'] else '적용되지 않음 · 시각을 확인해 주세요' }}
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 알림 쉬는 시간 설정
              시작과 종료를 각각 눌러 **날짜와 시간**을 정하세요. 이 기간에는 생활 변화 알림만 쉬고, 밥솥 연결 알림은 계속 받을 수 있어요.
          - type: tile
            entity: input_datetime.bapsim_pause_from
            name: 언제부터
            icon: mdi:calendar-start
            tap_action:
              action: more-info
          - type: tile
            entity: input_datetime.bapsim_control_until
            name: 언제까지
            icon: mdi:calendar-end
            tap_action:
              action: more-info
          - type: conditional
            conditions:
              - condition: template
                value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) <= as_timestamp(now()) or as_timestamp(states('input_datetime.bapsim_pause_from'), 0) == 0 or as_timestamp(states('input_datetime.bapsim_pause_from'), 0) >= as_timestamp(states('input_datetime.bapsim_control_until'), 0) }}"
            card:
              type: markdown
              content: 종료 시각은 미래로, 시작 시각은 종료보다 앞으로 정해 주세요.
          - type: conditional
            conditions:
              - condition: template
                value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) > as_timestamp(now()) and as_timestamp(states('input_datetime.bapsim_pause_from'), 0) > 0 and as_timestamp(states('input_datetime.bapsim_pause_from'), 0) < as_timestamp(states('input_datetime.bapsim_control_until'), 0) }}"
            card:
              type: button
              name: 이 기간 저장
              show_icon: false
              icon: mdi:bell-sleep
              tap_action:
                action: perform-action
                perform_action: bapsim.dashboard_control
                data: {action: pause_lifestyle}
      - type: markdown
        content: |
          ## 지난 쉬기
          {% set pauses = state_attr('sensor.bapsim_notification_controls', 'pauses') or {} %}
          {% set past = namespace(count=0) %}
          {% for pause in pauses.values() | sort(attribute='ends_at', reverse=true) %}
          {% if as_timestamp(pause.ends_at, 0) <= as_timestamp(now()) and past.count < 3 %}
          {% set past.count = past.count + 1 %}
          - **지난 {{ past.count }}번** · {{ as_timestamp(pause.starts_at) | timestamp_custom('%m/%d %H:%M', true) }} → {{ as_timestamp(pause.ends_at) | timestamp_custom('%m/%d %H:%M', true) }}
          {% endif %}
          {% endfor %}
          {% if past.count == 0 %}
          지난 쉬기 내역이 없어요.
          {% endif %}
  - title: 자세한 기록
    path: details
    icon: mdi:text-box-search
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 기록 자세히 보기
          뚜껑 열림·취사 기록을 바탕으로 평소와 다른 사용을 살펴보고, 안부 확인이 필요할지 유추합니다. 실제 식사·건강 상태는 직접 확인이 필요합니다.
          {% set output = states('sensor.bapsim_output_state') %}
          {% set issue = states('sensor.bapsim_observation_issue_status') %}
          {% if output in ['awaiting_matter', 'expired', 'unknown', 'unavailable', 'waiting'] %}
          **현재 실물 사용 기록이 부족합니다.** 새 기록이 들어오면 평소와 비교합니다.
          {% else %}
          **최근 밥솥 기록:** {{ as_timestamp(state_attr('sensor.bapsim_output_state', 'last_usage_at'), 0) | timestamp_custom('%m월 %d일 %H:%M', true) if state_attr('sensor.bapsim_output_state', 'last_usage_at') else '사용 시각을 확인할 수 없음' }}
          {% endif %}
          **연결 상태:** {{ {'available':'연결됨', 'partial':'일부 기록만 확인됨', 'disconnected':'연결 끊김', 'alert_requested':'연결 확인 필요', 'not_observed':'아직 확인할 기록 없음'}.get(issue, '확인할 수 없음') }}
          {% set baseline = states('sensor.bapsim_baseline') %}
          **개인 비교 기준:** {{ {'ready':'평소 패턴과 비교 가능', 'learning':'평소 패턴을 모으는 중', 'waiting':'비교할 기록 부족', 'not_observed':'비교할 기록 부족'}.get(baseline, '확인할 수 없음') }}
          {% set context = states('sensor.bapsim_usage_context') %}
          {% if context not in ['waiting', 'unknown', 'unavailable'] %}
          **최근 뚜껑 열림:** {{ {'warming_possible_use':'보온 중 열림', 'recent_cooking_possible_use':'취사 후 열림', 'unclassified_open':'열림 · 용도 알 수 없음'}.get(context, '용도 알 수 없음') }}
          {% endif %}
          {% set f = states.sensor.bapsim_features.attributes if states.sensor.bapsim_features is defined else {} %}
          {% if f.get('cook_count_24h') is not none %}
          **최근 24시간 취사 기록:** {{ f.get('cook_count_24h') }}회
          {% endif %}

  - title: 사용 시간 설정
    path: routine
    icon: mdi:calendar-clock
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 평소 밥솥 사용 시간
          필요한 시간만 추가하세요. 시간마다 **매주 반복할 요일**을 다르게 정할 수 있습니다. 특정 날짜만 쉬려면 [알림 쉬기](/bapsim-lab/travel)를 이용하세요.
          {% set routines = state_attr('sensor.bapsim_initial_routine', 'routines') or [] %}
          {% if routines %}
          **저장된 사용 시간**
          {% for item in routines %}
          {% for w in item.windows %}
          {% set label = namespace(days=[]) %}
          {% for day in w.weekdays %}
          {% set label.days = label.days + [['월','화','수','목','금','토','일'][day]] %}
          {% endfor %}
          - **{{ w.time }}** · {{ '매일' if w.weekdays | length == 7 else label.days | join('·') }}
          {% endfor %}
          {% endfor %}
          {% else %}
          **저장된 시간이 없습니다.** 아래에서 첫 시간을 추가하세요.
          {% endif %}
      - type: entities
        title: 사용 시간 추가
        entities:
          - entity: input_datetime.bapsim_routine_time_1
            name: 시간
          - entity: input_select.bapsim_routine_days_1
            name: 반복할 요일
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_routine_days_1
            state: 요일 직접 선택
        card:
          type: grid
          title: 반복할 요일 선택
          columns: 7
          square: false
          cards:
            - type: button
              entity: input_boolean.bapsim_routine_day_1_0
              name: 월
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_1
              name: 화
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_2
              name: 수
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_3
              name: 목
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_4
              name: 금
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_5
              name: 토
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_6
              name: 일
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
      - type: conditional
        conditions:
          - condition: template
            value_template: >-
              {% set days = states('input_select.bapsim_routine_days_1') %}
              {% set selected = namespace(any=false) %}
              {% for day in range(7) %}
                {% if is_state('input_boolean.bapsim_routine_day_1_' ~ day, 'on') %}
                  {% set selected.any = true %}
                {% endif %}
              {% endfor %}
              {{ days in ['매일', '평일', '주말'] or
                 (days == '요일 직접 선택' and selected.any) }}
        card:
          type: button
          name: 이 시간 추가
          icon: mdi:plus-circle
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_add_routine
      - type: conditional
        conditions:
          - condition: template
            value_template: >-
              {{ (state_attr('sensor.bapsim_initial_routine', 'routines') or []) | count > 0 }}
        card:
          type: vertical-stack
          cards:
            - type: entities
              title: 저장된 시간 삭제
              entities:
                - entity: input_select.bapsim_routine_remove
                  name: 삭제할 시간
            - type: button
              name: 선택한 시간 삭제
              icon: mdi:delete-outline
              tap_action:
                action: perform-action
                perform_action: bapsim.dashboard_remove_routine
                confirmation:
                  text: 선택한 사용 시간을 삭제할까요?
      - type: markdown
        content: |
          {% set result = states('sensor.bapsim_initial_routine_result') %}
          {% if result == 'applied' %}
          **저장됐습니다.** 위의 사용 시간 목록을 확인해 주세요.
          {% elif result == 'failed' %}
          **저장하지 못했습니다.** {{ state_attr('sensor.bapsim_initial_routine_result', 'reason') or '입력과 밥솥 연결을 확인해 주세요.' }}
          {% endif %}
          설정한 시간과 실제 밥솥 사용의 차이를 살펴보고, 안부 확인이 필요할지 유추하는 데 사용합니다.
  - title: 가상 입력
    path: simulator
    icon: mdi:rice
    cards:
      - type: markdown
        content: |
          ## 가상 밥솥 입력
          개발·시연용 화면입니다. 아래 버튼은 가짜 밥솥 신호를 하나씩 만듭니다. 실제 보드나 보호자 알림에는 영향을 주지 않으며, 7일 사용 기록을 한 번에 학습하는 기능도 아닙니다.
      - type: grid
        title: 가상 신호 보내기
        columns: 2
        square: false
        cards:
          - type: button
            name: 뚜껑 열기
            icon: mdi:pot-steam
            tap_action: {action: perform-action, perform_action: script.bapsim_lid_open}
          - type: button
            name: 뚜껑 닫기
            icon: mdi:pot
            tap_action: {action: perform-action, perform_action: script.bapsim_lid_close}
          - type: button
            name: 취사 시작
            icon: mdi:play
            tap_action: {action: perform-action, perform_action: script.bapsim_cooking_start}
          - type: button
            name: 취사 완료
            icon: mdi:check
            tap_action: {action: perform-action, perform_action: script.bapsim_cooking_finish}
          - type: button
            name: 통신 끊기
            icon: mdi:lan-disconnect
            tap_action: {action: perform-action, perform_action: script.bapsim_disconnect}
          - type: button
            name: 통신 복구
            icon: mdi:lan-connect
            tap_action: {action: perform-action, perform_action: script.bapsim_reconnect}
          - type: button
            name: 외출 시작
            icon: mdi:exit-run
            tap_action: {action: perform-action, perform_action: script.bapsim_away_start}
          - type: button
            name: 외출 종료
            icon: mdi:home-import-outline
            tap_action: {action: perform-action, perform_action: script.bapsim_away_end}
      - type: markdown
        content: |
          ## 현재 가상 상태
          - 뚜껑: **{{ {'open':'열림', 'closed':'닫힘'}.get(states('input_select.bapsim_lid_state'), '아직 선택하지 않음') }}**
          - 취사: **{{ {'started':'시작', 'finished':'완료'}.get(states('input_select.bapsim_cooking_state'), '아직 선택하지 않음') }}**
          - 연결: **{{ {'online':'연결됨', 'offline':'연결 끊김'}.get(states('input_select.bapsim_availability'), '아직 선택하지 않음') }}**
          - 외출: **{{ {'away':'외출 중', 'home':'집에 있음'}.get(states('input_select.bapsim_away_state'), '아직 선택하지 않음') }}**
          {% set result = states('sensor.bapsim_simulation_output_state') %}
          {% if result not in ['waiting', 'expired', 'unknown', 'unavailable', 'awaiting_matter'] %}
          **가상 분석:** {{ result }}
          {% else %}
          **가상 분석:** 새 결과를 기다리는 중
          {% endif %}
          원본 상태와 변화 기록은 [개발자 진단](/bapsim-lab/diagnostics)에서 확인할 수 있습니다.
  - title: 보드→폰 연결 시험
    path: a05-test
    icon: mdi:test-tube
    cards:
      - type: markdown
        content: |
          ## 보드→폰 연결 시험
          실제 보드 신호가 밥심 기록을 거쳐 시험 폰 알림 요청까지 이어지는지 확인합니다. 이 시험으로 개인 학습이나 실제 식사 여부를 판단하지 않습니다.
          시작 버튼은 신호를 만들지 않습니다. 시작 후 10분 안에 뚜껑 시험은 닫힘→열림 신호를, 조리 단계 시험은 대기→취사→보온→판단 불가 신호를 차례로 보내야 합니다. 조건을 충족하면 시험 폰에 알림을 최대 1회 요청합니다.
      - type: entities
        title: 시험 장치 설정 · 개발 담당자용
        entities:
          - entity: input_select.bapsim_a05_test_scenario
            name: 시험 방식
          - entity: input_text.bapsim_a05_test_device_id
            name: 보드 등록 이름
          - entity: input_text.bapsim_a05_test_entity_id
            name: 보드 신호 센서 주소
          - entity: input_text.bapsim_a05_test_phone_service
            name: 시험 폰 알림 연결 이름
      - type: horizontal-stack
        cards:
          - type: button
            name: 시험 시작
            icon: mdi:play-circle-outline
            tap_action:
              action: perform-action
              perform_action: script.bapsim_start_a05_test
              confirmation:
                title: 보드→폰 연결 시험 시작
                text: 실제 보드에서 신호가 들어오면 설정한 시험 폰에 알림을 최대 1회 요청합니다. 시작할까요?
                confirm_text: 시작
                dismiss_text: 돌아가기
          - type: button
            name: 시험 종료
            icon: mdi:stop-circle-outline
            tap_action:
              action: perform-action
              perform_action: bapsim.stop_a05_connection_test
      - type: markdown
        content: |
          ## 연결 시험 진행
          {% set a = states.sensor.bapsim_a05_connection_test.attributes if states.sensor.bapsim_a05_connection_test is defined else {} %}
          {% set phase = states('sensor.bapsim_a05_connection_test') %}
          {% set phase_names = {'not_armed':'시작 전', 'await_closed':'새 닫힘 신호 대기', 'closed_observed':'닫힘 확인 · 열림 대기', 'board_input_confirmed':'보드 신호 확인 · 알림 요청 준비', 'ha_accepted':'시험 폰 알림 요청 완료 · 폰 수신 확인 필요', 'delivery_failed':'시험 폰 알림 요청 실패', 'stopped':'시험 종료', 'expired':'10분 경과로 종료', 'storage_failed':'시험 기록 저장 실패', 'await_inactive':'조리 대기 신호 대기', 'observed_1_of_4':'조리 대기 확인 · 취사 신호 대기', 'observed_2_of_4':'취사 확인 · 보온 신호 대기', 'observed_3_of_4':'보온 확인 · 판단 불가 신호 대기'} %}
          **현재 상태:** {{ phase_names.get(phase, '상태를 확인할 수 없음') }}
          {% if a.get('test_run_id') %}
          - 시험 방식: {{ '조리 단계 신호 확인' if a.get('scenario') == 'a07_phase_sequence' else '뚜껑 닫힘→열림' }}
          - 시험 폰 알림 요청: **{{ '시도함' if a.get('mobile_attempted', false) else '아직 안 함' }}**
          {% endif %}
          알림 요청 완료는 실제 폰 수신을 뜻하지 않습니다. 폰에서 직접 확인해 주세요.
          원본 시험 기록은 [개발자 진단](/bapsim-lab/diagnostics)에서 확인할 수 있습니다.
  - title: 개발자 진단
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: markdown
        content: |
          ## 내부 진단
          실물·가상 입력과 처리 단계를 확인하는 개발 담당자용 화면입니다. 아래 영문값은 문제를 추적할 때 쓰는 원본 상태 코드입니다.
      - type: markdown
        content: |
          ## 보드 연결 시험 원본 기록
          {% set a = states.sensor.bapsim_a05_connection_test.attributes if states.sensor.bapsim_a05_connection_test is defined else {} %}
          {% set r = a.get('result') or {} %}
          {% if a.get('test_run_id') %}
          - 시험 번호: `{{ a.test_run_id }}`
          - 시험 보드: `{{ a.get('device_id', '없음') }}`
          - 닫힘 신호 기록: `{{ a.get('closed_record_id') or '대기' }}`
          - 열림 또는 마지막 단계 기록: `{{ r.get('opened_record_id') or '대기' }}`
          {% for item in a.get('phase_evidence', []) %}
          - {{ {'inactive':'대기', 'cooking':'취사', 'warming':'보온', 'unknown':'판단 불가'}.get(item.phase, '조리 단계') }} 신호: `{{ item.record_id }}`
          {% endfor %}
          {% if r.get('model_version') %}
          - 보드 판단 프로그램 버전: `{{ r.model_version }}`
          {% endif %}
          {% else %}
          아직 시작한 시험이 없습니다.
          {% endif %}
      - type: entities
        title: 실물 입력·판정 내부 상태
        entities:
          - entity: sensor.bapsim_output_state
            name: 실물 분석 상태
          - entity: sensor.bapsim_observation_issue_status
            name: 수집·연결 상태
          - entity: sensor.bapsim_baseline
            name: 개인 기준 학습
          - entity: sensor.bapsim_usage_context
            name: 최근 개방의 보드 맥락
          - entity: sensor.bapsim_detection_status
            name: 밥솥 사용 변화 판정
          - entity: sensor.bapsim_decline_detection
            name: 사용 감소 판정
          - entity: sensor.bapsim_interval_detection
            name: 사용 간격 판정
          - entity: sensor.bapsim_features
            name: 현재 분석 특징
          - entity: sensor.bapsim_mqtt_output
            name: MQTT 상태 전송
          - entity: sensor.bapsim_auxiliary_deferral
            name: 보조 활동에 따른 판단 보류
          - entity: sensor.bapsim_matter_input
            name: 실물 밥솥 입력
          - entity: sensor.bapsim_away
            name: 외출 상태
          - entity: sensor.bapsim_workflow_status
            name: 보호자 확인 상태
          - entity: sensor.bapsim_decline_status
            name: 사용 감소 안내 상태
          - entity: sensor.bapsim_notification_delivery
            name: 알림 전달 상태
          - entity: sensor.bapsim_notification_controls
            name: 알림 설정 변경 번호
          - entity: sensor.bapsim_notification_control_result
            name: 최근 알림 조작 결과
          - entity: input_select.bapsim_availability
            name: 시뮬레이터 통신 상태
      - type: entities
        title: 가상 입력·분석 원본 상태
        entities:
          - entity: input_select.bapsim_lid_state
            name: 가상 뚜껑 신호
          - entity: input_select.bapsim_cooking_state
            name: 가상 취사 신호
          - entity: input_select.bapsim_availability
            name: 가상 연결 신호
          - entity: input_select.bapsim_away_state
            name: 가상 외출 신호
          - entity: sensor.bapsim_simulation_output_state
            name: 가상 분석 상태
          - entity: sensor.bapsim_simulation_baseline
            name: 가상 개인 기준
          - entity: sensor.bapsim_simulation_features
            name: 가상 분석 특징
          - entity: sensor.bapsim_simulation_detection_status
            name: 가상 사용 변화 판정
          - entity: sensor.bapsim_simulation_workflow_status
            name: 가상 보호자 확인 상태
          - entity: sensor.bapsim_simulation_notification_delivery
            name: 가상 알림 단계
      - type: history-graph
        title: 최근 24시간 가상 신호 기록
        hours_to_show: 24
        entities:
          - input_select.bapsim_lid_state
          - input_select.bapsim_cooking_state
          - input_select.bapsim_availability
          - input_select.bapsim_away_state
      - type: history-graph
        title: 최근 7일 판정·응답 기록
        hours_to_show: 168
        entities:
          - sensor.bapsim_detection_status
          - sensor.bapsim_workflow_status
          - sensor.bapsim_decline_status
