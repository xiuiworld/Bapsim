title: 밥심
views:
  - title: 밥심
    path: status
    type: panel
    cards:
    - type: custom:bapsim-caregiver
      paths:
        travel: pause
        details: caregiver-details
        notice: caregiver-details
  - title: 안내 확인
    path: notice
    icon: mdi:bell-check
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 확인할 안내
          {% set options = state_attr('input_select.bapsim_active_assessment', 'options') or [] %}
          {% if options | length > 1 %}
          확인할 안내를 고른 뒤 실제 확인한 내용에 맞게 기록해 주세요.
          {% else %}
          **현재 처리할 안내가 없습니다.** 새 사용 변화가 확인되면 여기에 표시됩니다.
          {% endif %}
      - type: conditional
        conditions:
          - condition: template
            value_template: "{{ (state_attr('input_select.bapsim_active_assessment', 'options') or []) | length > 1 }}"
        card:
          type: entities
          title: 어떤 안내인가요?
          entities:
            - entity: input_select.bapsim_active_assessment
              name: 확인할 안내 선택
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: grid
          title: 안부 확인 기록
          columns: 2
          square: false
          cards:
            - type: button
              name: 안부 확인 중
              show_icon: false
              icon: mdi:account-search
              tap_action:
                action: perform-action
                perform_action: bapsim.respond
                data: {response: checking}
            - type: button
              name: 안부 확인 완료
              show_icon: false
              icon: mdi:check-circle
              tap_action:
                action: perform-action
                perform_action: bapsim.respond
                data: {response: resolved}
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: markdown
          content: |
            ### 나중에 다시 알림받기
            아래 시각까지 선택한 안내의 재알림을 보류합니다. **안부 확인 완료를 뜻하지 않습니다.**
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: button
          name: 재알림 시각을 내일로 설정
          show_icon: false
          icon: mdi:calendar-today
          tap_action:
            action: perform-action
            perform_action: script.bapsim_prepare_control_until
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
        card:
          type: entities
          entities:
            - entity: input_datetime.bapsim_control_until
              name: 다시 알림받을 시각
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) <= as_timestamp(now()) }}"
        card:
          type: markdown
          content: 종료 시각이 지났습니다. 위 버튼으로 내일을 선택하거나 미래 시각을 입력해 주세요.
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_active_assessment
            state_not: [선택, unknown, unavailable]
          - condition: template
            value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) > as_timestamp(now()) }}"
        card:
          type: button
          name: 이 시각까지 재알림 보류
          show_icon: false
          icon: mdi:bell-sleep
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_control
            data: {action: acknowledge}
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.bapsim_notification_control_result
            state: [accepted, rejected, failed, submitted, applying]
        card:
          type: markdown
          content: |
            {% set result = states('sensor.bapsim_notification_control_result') %}
            **최근 알림 조작:** {{ '적용됨' if result == 'accepted' else '처리 중' if result in ['submitted', 'applying'] else '적용되지 않음 · 안내와 시각을 확인해 주세요' }}

  - title: 알림 쉬기
    path: travel
    icon: mdi:bell-sleep
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 저장된 알림 쉬기
              {% set pauses = state_attr('sensor.bapsim_notification_controls', 'pauses') or {} %}
              {% set present = namespace(count=0) %}
              {% for pause in pauses.values() | sort(attribute='starts_at') %}
              {% if as_timestamp(pause.ends_at, 0) > as_timestamp(now()) %}
              {% set present.count = present.count + 1 %}
              **{{ present.count }}번 · {{ '진행 중' if as_timestamp(pause.starts_at, 0) <= as_timestamp(now()) else '예정' }}**\
              {{ as_timestamp(pause.starts_at) | timestamp_custom('%m/%d %H:%M', true) }} → {{ as_timestamp(pause.ends_at) | timestamp_custom('%m/%d %H:%M', true) }}
              {% endif %}
              {% endfor %}
              {% if present.count == 0 %}
              진행 중이거나 예정된 쉬기 기간이 없어요.
              {% endif %}
          - type: entities
            title: 저장된 설정 삭제
            entities:
              - entity: input_select.bapsim_active_pause
                name: 삭제할 기간 선택
          - type: markdown
            content: |
              {% set options = state_attr('input_select.bapsim_active_pause', 'options') or [] %}
              {% if options | length <= 1 %}
              삭제할 쉬기 설정이 없어요. 새 기간을 저장하면 여기에서 삭제할 수 있습니다.
              {% elif states('input_select.bapsim_active_pause') in ['선택', 'unknown', 'unavailable'] %}
              위에서 삭제할 기간을 선택해 주세요.
              {% else %}
              선택한 기간을 아래 버튼으로 삭제할 수 있습니다.
              {% endif %}
          - type: conditional
            conditions:
              - condition: state
                entity: input_select.bapsim_active_pause
                state_not: [선택, unknown, unavailable]
            card:
              type: button
              name: 선택한 설정 삭제
              show_icon: false
              icon: mdi:delete-outline
              tap_action:
                action: perform-action
                perform_action: bapsim.dashboard_control
                data: {action: cancel_pause}
                confirmation:
                  title: 알림 쉬기 삭제
                  text: 선택한 쉬기 기간을 삭제할까요? 다른 쉬기 설정은 유지됩니다.
                  confirm_text: 삭제
                  dismiss_text: 돌아가기
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.bapsim_notification_control_result
                state: [accepted, rejected, failed, submitted, applying]
            card:
              type: markdown
              content: |
                {% set result = states('sensor.bapsim_notification_control_result') %}
                **최근 조작:** {{ '적용됨' if result == 'accepted' else '처리 중' if result in ['submitted', 'applying'] else '적용되지 않음 · 시각을 확인해 주세요' }}
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              ## 알림 쉬는 시간 설정
              시작과 종료를 각각 눌러 **날짜와 시간**을 정하세요. 이 기간에는 생활 변화 알림만 쉬고, 밥솥 연결 알림은 계속 받을 수 있어요.
          - type: tile
            entity: input_datetime.bapsim_pause_from
            name: 언제부터
            icon: mdi:calendar-start
            tap_action:
              action: more-info
          - type: tile
            entity: input_datetime.bapsim_control_until
            name: 언제까지
            icon: mdi:calendar-end
            tap_action:
              action: more-info
          - type: conditional
            conditions:
              - condition: template
                value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) <= as_timestamp(now()) or as_timestamp(states('input_datetime.bapsim_pause_from'), 0) == 0 or as_timestamp(states('input_datetime.bapsim_pause_from'), 0) >= as_timestamp(states('input_datetime.bapsim_control_until'), 0) }}"
            card:
              type: markdown
              content: 종료 시각은 미래로, 시작 시각은 종료보다 앞으로 정해 주세요.
          - type: conditional
            conditions:
              - condition: template
                value_template: "{{ as_timestamp(states('input_datetime.bapsim_control_until'), 0) > as_timestamp(now()) and as_timestamp(states('input_datetime.bapsim_pause_from'), 0) > 0 and as_timestamp(states('input_datetime.bapsim_pause_from'), 0) < as_timestamp(states('input_datetime.bapsim_control_until'), 0) }}"
            card:
              type: button
              name: 이 기간 저장
              show_icon: false
              icon: mdi:bell-sleep
              tap_action:
                action: perform-action
                perform_action: bapsim.dashboard_control
                data: {action: pause_lifestyle}
      - type: markdown
        content: |
          ## 지난 쉬기
          {% set pauses = state_attr('sensor.bapsim_notification_controls', 'pauses') or {} %}
          {% set past = namespace(count=0) %}
          {% for pause in pauses.values() | sort(attribute='ends_at', reverse=true) %}
          {% if as_timestamp(pause.ends_at, 0) <= as_timestamp(now()) and past.count < 3 %}
          {% set past.count = past.count + 1 %}
          - **지난 {{ past.count }}번** · {{ as_timestamp(pause.starts_at) | timestamp_custom('%m/%d %H:%M', true) }} → {{ as_timestamp(pause.ends_at) | timestamp_custom('%m/%d %H:%M', true) }}
          {% endif %}
          {% endfor %}
          {% if past.count == 0 %}
          지난 쉬기 내역이 없어요.
          {% endif %}
  - title: 자세한 기록
    path: details
    icon: mdi:text-box-search
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 기록 자세히 보기
          뚜껑 열림·취사 기록을 바탕으로 평소와 다른 사용을 살펴보고, 안부 확인이 필요할지 유추합니다. 실제 식사·건강 상태는 직접 확인이 필요합니다.
          {% set output = states('sensor.bapsim_output_state') %}
          {% set issue = states('sensor.bapsim_observation_issue_status') %}
          {% if output in ['awaiting_matter', 'expired', 'unknown', 'unavailable', 'waiting'] %}
          **현재 실물 사용 기록이 부족합니다.** 새 기록이 들어오면 평소와 비교합니다.
          {% else %}
          **최근 밥솥 기록:** {{ as_timestamp(state_attr('sensor.bapsim_output_state', 'last_usage_at'), 0) | timestamp_custom('%m월 %d일 %H:%M', true) if state_attr('sensor.bapsim_output_state', 'last_usage_at') else '사용 시각을 확인할 수 없음' }}
          {% endif %}
          **연결 상태:** {{ {'available':'연결됨', 'partial':'일부 기록만 확인됨', 'disconnected':'연결 끊김', 'alert_requested':'연결 확인 필요', 'not_observed':'아직 확인할 기록 없음'}.get(issue, '확인할 수 없음') }}
          {% set baseline = states('sensor.bapsim_baseline') %}
          **개인 비교 기준:** {{ {'ready':'평소 패턴과 비교 가능', 'learning':'평소 패턴을 모으는 중', 'waiting':'비교할 기록 부족', 'not_observed':'비교할 기록 부족'}.get(baseline, '확인할 수 없음') }}
          {% set context = states('sensor.bapsim_usage_context') %}
          {% if context not in ['waiting', 'unknown', 'unavailable'] %}
          **최근 뚜껑 열림:** {{ {'warming_possible_use':'보온 중 열림', 'recent_cooking_possible_use':'취사 후 열림', 'unclassified_open':'열림 · 용도 알 수 없음'}.get(context, '용도 알 수 없음') }}
          {% endif %}
          {% set f = states.sensor.bapsim_features.attributes if states.sensor.bapsim_features is defined else {} %}
          {% if f.get('cook_count_24h') is not none %}
          **최근 24시간 취사 기록:** {{ f.get('cook_count_24h') }}회
          {% endif %}

  - title: 사용 시간 설정
    path: routine
    icon: mdi:calendar-clock
    subview: true
    back_path: /bapsim-lab/status
    cards:
      - type: markdown
        content: |
          ## 평소 밥솥 사용 시간
          필요한 시간만 추가하세요. 시간마다 **매주 반복할 요일**을 다르게 정할 수 있습니다. 특정 날짜만 쉬려면 [알림 쉬기](/bapsim-lab/travel)를 이용하세요.
          {% set routines = state_attr('sensor.bapsim_initial_routine', 'routines') or [] %}
          {% if routines %}
          **저장된 사용 시간**
          {% for item in routines %}
          {% for w in item.windows %}
          {% set label = namespace(days=[]) %}
          {% for day in w.weekdays %}
          {% set label.days = label.days + [['월','화','수','목','금','토','일'][day]] %}
          {% endfor %}
          - **{{ w.time }}** · {{ '매일' if w.weekdays | length == 7 else label.days | join('·') }}
          {% endfor %}
          {% endfor %}
          {% else %}
          **저장된 시간이 없습니다.** 아래에서 첫 시간을 추가하세요.
          {% endif %}
      - type: entities
        title: 사용 시간 추가
        entities:
          - entity: input_datetime.bapsim_routine_time_1
            name: 시간
          - entity: input_select.bapsim_routine_days_1
            name: 반복할 요일
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.bapsim_routine_days_1
            state: 요일 직접 선택
        card:
          type: grid
          title: 반복할 요일 선택
          columns: 7
          square: false
          cards:
            - type: button
              entity: input_boolean.bapsim_routine_day_1_0
              name: 월
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_1
              name: 화
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_2
              name: 수
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_3
              name: 목
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_4
              name: 금
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_5
              name: 토
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
            - type: button
              entity: input_boolean.bapsim_routine_day_1_6
              name: 일
              icon: mdi:check
              icon_height: 18px
              tap_action: {action: toggle}
      - type: conditional
        conditions:
          - condition: template
            value_template: >-
              {% set days = states('input_select.bapsim_routine_days_1') %}
              {% set selected = namespace(any=false) %}
              {% for day in range(7) %}
                {% if is_state('input_boolean.bapsim_routine_day_1_' ~ day, 'on') %}
                  {% set selected.any = true %}
                {% endif %}
              {% endfor %}
              {{ days in ['매일', '평일', '주말'] or
                 (days == '요일 직접 선택' and selected.any) }}
        card:
          type: button
          name: 이 시간 추가
          icon: mdi:plus-circle
          tap_action:
            action: perform-action
            perform_action: bapsim.dashboard_add_routine
      - type: conditional
        conditions:
          - condition: template
            value_template: >-
              {{ (state_attr('sensor.bapsim_initial_routine', 'routines') or []) | count > 0 }}
        card:
          type: vertical-stack
          cards:
            - type: entities
              title: 저장된 시간 삭제
              entities:
                - entity: input_select.bapsim_routine_remove
                  name: 삭제할 시간
            - type: button
              name: 선택한 시간 삭제
              icon: mdi:delete-outline
              tap_action:
                action: perform-action
                perform_action: bapsim.dashboard_remove_routine
                confirmation:
                  text: 선택한 사용 시간을 삭제할까요?
      - type: markdown
        content: |
          {% set result = states('sensor.bapsim_initial_routine_result') %}
          {% if result == 'applied' %}
          **저장됐습니다.** 위의 사용 시간 목록을 확인해 주세요.
          {% elif result == 'failed' %}
          **저장하지 못했습니다.** {{ state_attr('sensor.bapsim_initial_routine_result', 'reason') or '입력과 밥솥 연결을 확인해 주세요.' }}
          {% endif %}
          설정한 시간과 실제 밥솥 사용의 차이를 살펴보고, 안부 확인이 필요할지 유추하는 데 사용합니다.
  - title: 가상 신호 시험
    path: simulator
    icon: mdi:rice
    cards:
      - type: markdown
        content: |
          ## 가상 신호 시험
          개발·시연용입니다. 버튼을 누를 때마다 **가상 신호 하나**가 기록됩니다. 실제 보드 신호나 보호자 알림으로 취급되지 않습니다.

          **시연 순서:** 뚜껑 닫기 → 열기 → 취사 시작 → 취사 완료. 버튼을 누른 뒤 아래 *현재 가상 상태*에서 바뀐 값을 확인하세요. 이 순서만으로 개인 사용 기록이 학습되거나 안부 판단이 완성되지는 않습니다.
      - type: grid
        title: 밥솥 사용 신호
        columns: 2
        square: false
        cards:
          - type: button
            name: 뚜껑 열기
            icon: mdi:pot-steam
            tap_action: {action: perform-action, perform_action: script.bapsim_lid_open}
          - type: button
            name: 뚜껑 닫기
            icon: mdi:pot
            tap_action: {action: perform-action, perform_action: script.bapsim_lid_close}
          - type: button
            name: 취사 시작
            icon: mdi:play
            tap_action: {action: perform-action, perform_action: script.bapsim_cooking_start}
          - type: button
            name: 취사 완료
            icon: mdi:check
            tap_action: {action: perform-action, perform_action: script.bapsim_cooking_finish}
      - type: grid
        title: 연결·외출 신호
        columns: 2
        square: false
        cards:
          - type: button
            name: 통신 끊기
            icon: mdi:lan-disconnect
            tap_action: {action: perform-action, perform_action: script.bapsim_disconnect}
          - type: button
            name: 통신 복구
            icon: mdi:lan-connect
            tap_action: {action: perform-action, perform_action: script.bapsim_reconnect}
          - type: button
            name: 외출 시작
            icon: mdi:exit-run
            tap_action: {action: perform-action, perform_action: script.bapsim_away_start}
          - type: button
            name: 외출 종료
            icon: mdi:home-import-outline
            tap_action: {action: perform-action, perform_action: script.bapsim_away_end}
      - type: markdown
        content: |
          ## 현재 가상 상태
          - 뚜껑: **{{ {'open':'열림', 'closed':'닫힘'}.get(states('input_select.bapsim_lid_state'), '아직 선택하지 않음') }}**
          - 취사: **{{ {'started':'시작', 'finished':'완료'}.get(states('input_select.bapsim_cooking_state'), '아직 선택하지 않음') }}**
          - 연결: **{{ {'online':'연결됨', 'offline':'연결 끊김'}.get(states('input_select.bapsim_availability'), '아직 선택하지 않음') }}**
          - 외출: **{{ {'away':'외출 중', 'home':'집에 있음'}.get(states('input_select.bapsim_away_state'), '아직 선택하지 않음') }}**
          {% set result = states('sensor.bapsim_simulation_output_state') %}
          {% if result not in ['waiting', 'expired', 'unknown', 'unavailable', 'awaiting_matter'] %}
          **가상 분석 결과:** {{ result }}
          {% else %}
          **가상 분석 결과:** 새 결과를 기다리는 중
          {% endif %}
          이 값은 가상 입력의 처리 상태입니다. 보호자 화면의 실제 기록과는 별개입니다.
          원본 상태와 변화 기록은 [개발자 진단](/bapsim-lab/diagnostics)에서 확인할 수 있습니다.
  - title: 실물 연결 시험
    path: a05-test
    icon: mdi:test-tube
    cards:
      - type: markdown
        content: |
          ## 실물 연결 시험
          **실제 보드 → 밥심 기록 → 시험 폰 알림 요청** 경로를 확인합니다. 개인 학습이나 실제 식사 여부를 판단하는 시험은 아닙니다.

          1. 아래에서 시험 방식과 시험 폰을 확인합니다.
          2. **시험 시작**을 누릅니다. 이 버튼만으로 보드 신호는 생기지 않습니다.
          3. 보드 담당자가 **10분 안에** 선택한 신호를 차례로 보냅니다. 아래 진행 상태와 시험 폰 수신을 확인합니다.
      - type: entities
        title: 시험 장치 설정 · 개발 담당자용
        entities:
          - entity: input_select.bapsim_a05_test_scenario
            name: 시험 방식
          - entity: input_text.bapsim_a05_test_device_id
            name: 보드 등록 이름
          - entity: input_text.bapsim_a05_test_entity_id
            name: 보드 신호 센서 주소
          - entity: input_text.bapsim_a05_test_phone_service
            name: 시험 폰 알림 연결 이름
      - type: horizontal-stack
        cards:
          - type: button
            name: 연결 시험 시작
            icon: mdi:play-circle-outline
            tap_action:
              action: perform-action
              perform_action: script.bapsim_start_a05_test
              confirmation:
                title: 보드→폰 연결 시험 시작
                text: 실제 보드에서 신호가 들어오면 설정한 시험 폰에 알림을 최대 1회 요청합니다. 시작할까요?
                confirm_text: 시작
                dismiss_text: 돌아가기
          - type: button
            name: 시험 종료
            icon: mdi:stop-circle-outline
            tap_action:
              action: perform-action
              perform_action: bapsim.stop_a05_connection_test
      - type: markdown
        content: |
          ## 연결 시험 진행
          {% set a = states.sensor.bapsim_a05_connection_test.attributes if states.sensor.bapsim_a05_connection_test is defined else {} %}
          {% set phase = states('sensor.bapsim_a05_connection_test') %}
          {% set phase_names = {'not_armed':'시작 전', 'await_closed':'새 닫힘 신호 대기', 'closed_observed':'닫힘 확인 · 열림 대기', 'board_input_confirmed':'보드 신호 확인 · 알림 요청 준비', 'ha_accepted':'시험 폰 알림 요청 완료 · 폰 수신 확인 필요', 'delivery_failed':'시험 폰 알림 요청 실패', 'stopped':'시험 종료', 'expired':'10분 경과로 종료', 'storage_failed':'시험 기록 저장 실패', 'await_inactive':'조리 대기 신호 대기', 'observed_1_of_4':'조리 대기 확인 · 취사 신호 대기', 'observed_2_of_4':'취사 확인 · 보온 신호 대기', 'observed_3_of_4':'보온 확인 · 판단 불가 신호 대기'} %}
          **현재 상태:** {{ phase_names.get(phase, '상태를 확인할 수 없음') }}
          {% if phase in ['not_armed', 'stopped', 'unknown', 'unavailable'] %}
          **다음 행동:** 시험 방식과 시험 폰을 확인한 뒤 *연결 시험 시작*을 누르세요.
          {% elif phase == 'await_closed' %}
          **다음 행동:** 보드 담당자가 새 뚜껑 닫힘 신호를 보내야 합니다.
          {% elif phase == 'closed_observed' %}
          **다음 행동:** 보드 담당자가 뚜껑 열림 신호를 보내야 합니다.
          {% elif phase == 'await_inactive' %}
          **다음 행동:** 보드 담당자가 조리 대기 신호를 보내야 합니다.
          {% elif phase == 'observed_1_of_4' %}
          **다음 행동:** 보드 담당자가 취사 신호를 보내야 합니다.
          {% elif phase == 'observed_2_of_4' %}
          **다음 행동:** 보드 담당자가 보온 신호를 보내야 합니다.
          {% elif phase == 'observed_3_of_4' %}
          **다음 행동:** 보드 담당자가 판단 불가 신호를 보내야 합니다.
          {% elif phase == 'board_input_confirmed' %}
          **다음 행동:** 보드 신호는 확인됐습니다. 시험 폰 알림 요청 결과를 기다리세요.
          {% elif phase == 'ha_accepted' %}
          **다음 행동:** 시험 폰에서 알림이 실제로 도착했는지 직접 확인하세요.
          {% elif phase in ['delivery_failed', 'storage_failed', 'expired'] %}
          **다음 행동:** 보드 연결과 시험 폰 설정을 확인한 뒤 새 시험을 시작하세요.
          {% endif %}
          {% if a.get('test_run_id') %}
          - 시험 방식: {{ '조리 단계 신호 확인' if a.get('scenario') == 'a07_phase_sequence' else '뚜껑 닫힘→열림' }}
          - 시험 폰 알림 요청: **{{ '시도함' if a.get('mobile_attempted', false) else '아직 안 함' }}**
          {% endif %}
          알림 요청 완료는 실제 폰 수신을 뜻하지 않습니다.
          원본 시험 기록은 [개발자 진단](/bapsim-lab/diagnostics)에서 확인할 수 있습니다.
  - title: 개발자 진단
    path: diagnostics
    icon: mdi:stethoscope
    cards:
      - type: markdown
        content: |
          ## 내부 진단
          실물·가상 입력과 처리 단계를 확인하는 개발 담당자용 화면입니다. 아래 영문값은 문제를 추적할 때 쓰는 원본 상태 코드입니다.
      - type: markdown
        content: |
          ## 보드 연결 시험 원본 기록
          {% set a = states.sensor.bapsim_a05_connection_test.attributes if states.sensor.bapsim_a05_connection_test is defined else {} %}
          {% set r = a.get('result') or {} %}
          {% if a.get('test_run_id') %}
          - 시험 번호: `{{ a.test_run_id }}`
          - 시험 보드: `{{ a.get('device_id', '없음') }}`
          - 닫힘 신호 기록: `{{ a.get('closed_record_id') or '대기' }}`
          - 열림 또는 마지막 단계 기록: `{{ r.get('opened_record_id') or '대기' }}`
          {% for item in a.get('phase_evidence', []) %}
          - {{ {'inactive':'대기', 'cooking':'취사', 'warming':'보온', 'unknown':'판단 불가'}.get(item.phase, '조리 단계') }} 신호: `{{ item.record_id }}`
          {% endfor %}
          {% if r.get('model_version') %}
          - 보드 판단 프로그램 버전: `{{ r.model_version }}`
          {% endif %}
          {% else %}
          아직 시작한 시험이 없습니다.
          {% endif %}
      - type: entities
        title: 실물 입력·판정 내부 상태
        entities:
          - entity: sensor.bapsim_output_state
            name: 실물 분석 상태
          - entity: sensor.bapsim_observation_issue_status
            name: 수집·연결 상태
          - entity: sensor.bapsim_baseline
            name: 개인 기준 학습
          - entity: sensor.bapsim_usage_context
            name: 최근 개방의 보드 맥락
          - entity: sensor.bapsim_detection_status
            name: 밥솥 사용 변화 판정
          - entity: sensor.bapsim_decline_detection
            name: 사용 감소 판정
          - entity: sensor.bapsim_interval_detection
            name: 사용 간격 판정
          - entity: sensor.bapsim_features
            name: 현재 분석 특징
          - entity: sensor.bapsim_mqtt_output
            name: MQTT 상태 전송
          - entity: sensor.bapsim_auxiliary_deferral
            name: 보조 활동에 따른 판단 보류
          - entity: sensor.bapsim_matter_input
            name: 실물 밥솥 입력
          - entity: sensor.bapsim_away
            name: 외출 상태
          - entity: sensor.bapsim_workflow_status
            name: 보호자 확인 상태
          - entity: sensor.bapsim_decline_status
            name: 사용 감소 안내 상태
          - entity: sensor.bapsim_notification_delivery
            name: 알림 전달 상태
          - entity: sensor.bapsim_notification_controls
            name: 알림 설정 변경 번호
          - entity: sensor.bapsim_notification_control_result
            name: 최근 알림 조작 결과
          - entity: input_select.bapsim_availability
            name: 시뮬레이터 통신 상태
      - type: entities
        title: 가상 입력·분석 원본 상태
        entities:
          - entity: input_select.bapsim_lid_state
            name: 가상 뚜껑 신호
          - entity: input_select.bapsim_cooking_state
            name: 가상 취사 신호
          - entity: input_select.bapsim_availability
            name: 가상 연결 신호
          - entity: input_select.bapsim_away_state
            name: 가상 외출 신호
          - entity: sensor.bapsim_simulation_output_state
            name: 가상 분석 상태
          - entity: sensor.bapsim_simulation_baseline
            name: 가상 개인 기준
          - entity: sensor.bapsim_simulation_features
            name: 가상 분석 특징
          - entity: sensor.bapsim_simulation_detection_status
            name: 가상 사용 변화 판정
          - entity: sensor.bapsim_simulation_workflow_status
            name: 가상 보호자 확인 상태
          - entity: sensor.bapsim_simulation_notification_delivery
            name: 가상 알림 단계
      - type: history-graph
        title: 최근 24시간 가상 신호 기록
        hours_to_show: 24
        entities:
          - input_select.bapsim_lid_state
          - input_select.bapsim_cooking_state
          - input_select.bapsim_availability
          - input_select.bapsim_away_state
      - type: history-graph
        title: 최근 7일 판정·응답 기록
        hours_to_show: 168
        entities:
          - sensor.bapsim_detection_status
          - sensor.bapsim_workflow_status
          - sensor.bapsim_decline_status

  - title: 외출 기간 알림 쉬기
    path: pause
    subview: true
    back_path: /bapsim-lab/status
    cards:
    - type: entities
      title: 쉬는 기간과 적용 내역
      entities:
      - input_datetime.bapsim_control_until
      - input_select.bapsim_active_pause
    - type: markdown
      content: '## 외출·여행 중 알림 쉬기

        실제로 집을 비우는 기간에만 사용하세요. 이 조작은 **안전 확인이 아니며**, 생활 변화 안내를 종료 시각까지 쉬게 합니다. 위의 종료
        시각을 먼저 정하세요.

        '
    - type: button
      name: 종료 시각까지 생활 변화 알림 쉬기
      icon: mdi:bell-sleep
      tap_action:
        action: perform-action
        perform_action: bapsim.dashboard_control
        data:
          action: pause_lifestyle
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.bapsim_active_pause
        state_not:
        - 선택
        - unknown
        - unavailable
      card:
        type: button
        name: 선택한 알림 쉬기 취소
        icon: mdi:bell-cancel-outline
        tap_action:
          action: perform-action
          perform_action: bapsim.dashboard_control
          data:
            action: cancel_pause

  - title: 관측·처리 상세
    path: caregiver-details
    type: panel
    cards:
    - type: vertical-stack
      cards:
      - type: markdown
        content: '{% set o = ''sensor.bapsim_output_state'' %}

          {% set valid = as_timestamp(state_attr(o, ''valid_until''), 0) > as_timestamp(now())
          %}

          {% set usable = valid and state_attr(o, ''source'') == ''matter'' and state_attr(o,
          ''observation'') in [''available'', ''partial''] and states(''sensor.bapsim_observation_issue_status'')
          not in [''disconnected'', ''alert_requested''] %}

          {% set assessments = state_attr(o, ''assessments'') or [] %}

          {% set active = assessments | rejectattr(''status'', ''equalto'', ''resolved'')
          | list %}

          # 밥심 · 가족의 일상 살피기

          {% if not valid %}

          ## ◷ 새 관측을 기다리고 있습니다

          연결과 최근 수신 시각을 확인해 주세요. 오래된 기록으로 현재 사용 변화를 판단하지 않습니다.

          {% elif not usable %}

          ## ⚠ 연결 문제로 판단 보류

          밥솥 센서와 Home Assistant 연결을 확인해 주세요. 기록이 없다는 이유로 미사용으로 판단하지 않습니다.

          {% elif active | selectattr(''caregiver_status'', ''equalto'', ''checking'')
          | list %}

          ## ☎ 보호자가 확인 중입니다

          연락이나 방문으로 안부를 확인한 뒤 해당 안내의 **안부 확인 완료**를 눌러 주세요.

          {% elif active %}

          ## ☎ 안부 확인이 필요합니다

          평소와 다른 사용 공백 또는 사용 감소가 관측됐습니다. 아래 안내를 선택하고 가족에게 연락해 주세요.

          {% elif states(''sensor.bapsim_detection_status'') == ''check_required'' or
          states(''sensor.bapsim_interval_detection'') == ''watch'' %}

          ## ◷ 사용 공백을 관찰하고 있습니다

          예상한 사용 기록이 없어 변화를 살피고 있습니다. 확인 요청 조건을 충족하면 안내합니다.

          {% elif state_attr(o, ''learning'') != ''personalized'' %}

          ## ◷ 개인 사용 기록을 모으는 중

          평소와 비교할 기록이 아직 충분하지 않습니다. 입력한 시간과 관측 기록을 구분해 아래에 표시합니다.

          {% else %}

          ## ✓ 현재 안내할 사용 변화 없음

          기록에서 안내할 변화가 없다는 뜻이며, 안부 확인을 대신하지 않습니다.

          {% endif %}

          **실물 밥솥 기록** · 개방 기록은 식사 여부의 확정 증거가 아닙니다.

          '
      - type: markdown
        content: '## 지금 밥솥은

          {% set o = ''sensor.bapsim_current_observation'' %}

          {% set fields = state_attr(o, ''fields'') or {} %}

          {% set fresh = state_attr(o, ''source'') == ''matter'' and as_timestamp(state_attr(o,
          ''valid_until''), 0) > as_timestamp(now()) %}

          {% set lid = fields.get(''lid_open'', {}) %}

          {% set phase = fields.get(''cooker_phase'', {}) %}

          {% set temp = fields.get(''surface_temperature_c'', {}) %}

          {% set connected = fresh and fields.get(''device_connection'', {}).get(''value'')
          != ''offline'' and states(''sensor.bapsim_observation_issue_status'') not
          in [''disconnected'', ''alert_requested''] %}

          - 뚜껑 · **{{ (''열림'' if lid.get(''value'') == true else ''닫힘'') if connected
          and lid.get(''quality'') == ''good'' and lid.get(''value'') is not none else
          ''확인 불가'' }}**

          - 보드 추정 · **{{ {''cooking'':''취사 추정'', ''warming'':''보온 추정'', ''inactive'':''비활성
          추정''}.get(phase.get(''value''), ''판단 불가'') if connected and phase.get(''quality'')
          == ''good'' else ''판단 불가'' }}**

          - 부착 위치 표면 온도 · **{{ temp.get(''value'') ~ '' °C'' if connected and temp.get(''quality'')
          == ''good'' and temp.get(''value'') is not none else ''미확인'' }}** (내부 음식 온도가
          아닙니다)

          - 연결 · **{{ ''최근 보고 수신'' if connected else ''현재 관측 확인 필요'' }}**

          {% if not fresh %}

          최신 실물 보고가 없거나 유효 시간이 지났습니다. 이전 값을 현재값으로 표시하지 않습니다.

          {% elif not connected %}

          연결이 끊겨 현재값을 확인할 수 없습니다.

          {% elif lid.get(''quality'') != ''good'' or phase.get(''quality'') != ''good''
          or temp.get(''quality'') != ''good'' %}

          {% for field, label in [(lid, ''개폐''), (phase, ''보드 추정''), (temp, ''표면 온도'')]
          %}

          {% if field.get(''quality'') != ''good'' %}{{ label }}: {{ {''error'':''센서
          오류'', ''unsupported'':''지원되지 않는 값'', ''unavailable'':''연결 단절'', ''unknown'':''품질
          미확인''}.get(field.get(''quality''), ''관측 없음'') }}{% endif %}

          {% endfor %}

          일부 센서의 품질이 확인되지 않았습니다. 보드 추정이 없어도 유효한 개폐 기록은 별도로 수집합니다.

          {% endif %}

          {% for key, label in [(''source_at'',''관측 시각 추정''), (''received_at'',''HA
          수신'')] %}

          {% set at = state_attr(o, key) %}

          {% if at %}{{ label }}: {{ as_timestamp(at, 0) | timestamp_custom(''%m/%d
          %H:%M:%S'', true) }}{% endif %}

          {% endfor %}

          '
      - type: markdown
        content: '## 최근 기록과 평소 시간

          {% set o = ''sensor.bapsim_output_state'' %}

          {% set last = state_attr(o, ''last_usage_at'') %}

          **최근 사용 관련 개방:** {{ as_timestamp(last, 0) | timestamp_custom(''%m/%d %H:%M'',
          true) if last else ''수집된 기록 없음'' }}

          {% if as_timestamp(state_attr(o, ''valid_until''), 0) <= as_timestamp(now())
          %}

          마지막으로 수신한 이력입니다. 현재 사용 공백은 비교할 수 없습니다.

          {% endif %}

          {% set windows = state_attr(''sensor.bapsim_baseline'', ''windows'') or []
          %}

          {% if state_attr(o, ''learning'') == ''personalized'' %}

          **관측 기록으로 학습한 개인 기준**

          {% for w in windows if w.covered_days >= (state_attr(''sensor.bapsim_baseline'',
          ''min_covered_days'') or 7) and w.positive_days >= 5 and not w.schedule_excluded
          %}

          - {{ as_timestamp(w.expected_time, 0) | timestamp_custom(''%H:%M'', true)
          }} 전후 · 관측 {{ w.covered_days }}일

          {% endfor %}

          {% else %}

          **개인 기준 수집 중** · 충분한 연결 기록과 실제 사용일이 모여야 평소 시간을 비교할 수 있습니다.

          {% endif %}

          {% set routines = state_attr(''sensor.bapsim_initial_routine'', ''routines'')
          or [] %}

          {% if routines %}

          **가족이 입력한 초기 시간** (학습 결과와 별개)

          {% for r in routines %}{% for w in r.windows %}

          - {{ w.time }} · {{ ''매일'' if w.weekdays | length == 7 else ''평일'' if w.weekdays
          == [0,1,2,3,4] else ''주말'' if w.weekdays == [5,6] else ''지정 요일'' }}

          {% endfor %}{% endfor %}

          {% endif %}

          {% if state_attr(o, ''initial_basis'') %}현재 비교에는 초기 시간 설정이 활용되고 있습니다.{% endif
          %}

          '
      - type: markdown
        content: '## 확인 안내와 알림 진행

          {% set assessments = state_attr(''sensor.bapsim_output_state'', ''assessments'')
          or [] %}

          {% for a in assessments %}

          ### {{ ''최근 사용 감소'' if a.type == ''declining_usage'' else ''예상 시간대 사용 공백''
          }}

          {% if a.status == ''resolved'' %}

          **{{ {''caregiver_completed'':''보호자가 안부 확인 완료'', ''usage_resumed'':''개방 기록으로
          사용 재개 확인'', ''change_cleared'':''사용 변화 해소'', ''away_declared'':''외출 설정으로 안내
          종료'', ''request_cancelled'':''알림 요청 종료'', ''acknowledgement_expired'':''재알림
          보류 기한 종료''}.get(a.get(''resolution_reason''), ''종료된 안내 · 종료 사유 미확인'') }}**

          {% else %}

          **{{ ''보호자 확인 중'' if a.get(''caregiver_status'') == ''checking'' else ''확인
          요청 생성'' }}**

          {{ ''최근 사용 기록이 개인 기준보다 줄었습니다.'' if a.type == ''declining_usage'' else ''평소
          사용 시간대 또는 사용 간격을 지났지만 개방 기록이 없습니다.'' }}

          {% endif %}

          {% else %}

          생성된 확인 요청이 없습니다.

          {% endfor %}

          {% set d = states(''sensor.bapsim_notification_delivery'') %}

          {% set delivery_id = state_attr(''sensor.bapsim_notification_delivery'', ''incident_id'')
          %}

          {% set related = assessments | selectattr(''assessment_id'', ''defined'')
          | selectattr(''assessment_id'', ''equalto'', delivery_id) | list %}

          **{{ ''위 안내의 최근 알림 처리'' if related else ''별도 최근 알림 이력'' }}:** {{ {''not_sent'':''발송
          이력 없음'', ''pending'':''요청 처리 중'', ''ha_accepted'':''HA 서비스 호출 수락'', ''failed'':''전송
          실패'', ''uncertain'':''전송 결과 불명확'', ''paused'':''재알림 보류 또는 알림 쉬기 적용'', ''quiet_hours'':''야간
          시간대 발송 대기'', ''cancelled'':''요청 취소''}.get(d, ''처리 결과 미확인'') }}

          HA 서비스 호출 수락은 휴대폰 도착 증거가 아닙니다. 보호자 응답은 위 안내의 처리 상태로 확인하세요.

          {% if d in [''failed'',''uncertain''] %}알림을 기다리지 말고 필요하면 직접 연락해 주세요. 연결·수신
          대상 설정은 진단에서 확인하세요.{% endif %}

          '
      - type: button
        name: 평소 밥솥 사용 시간 설정
        icon: mdi:calendar-clock
        tap_action:
          action: navigate
          navigation_path: /bapsim-lab/routine
      - type: entities
        title: 확인할 안내와 종료 시각
        entities:
        - input_select.bapsim_active_assessment
        - input_datetime.bapsim_control_until
      - type: markdown
        content: '{% set until = states(''input_datetime.bapsim_control_until'') %}

          {% if until in [''unknown'', ''unavailable''] or as_timestamp(until, 0) <=
          as_timestamp(now()) %}

          **종료 시각을 미래로 다시 설정해 주세요.** 지난 시각으로는 확인 기한이나 알림 쉬기를 적용할 수 없습니다.

          {% endif %}

          **재알림 보류**는 선택한 안내의 *재알림을 지정 시각까지 보류*합니다. **확인 중/안부 확인 완료**는 실제 안부 확인의 진행
          상태를 기록하며 재알림 기한을 만들지 않습니다.

          '
      - type: conditional
        conditions:
        - condition: state
          entity: input_select.bapsim_active_assessment
          state_not:
          - 선택
          - unknown
          - unavailable
        - condition: state
          entity: sensor.bapsim_output_state
          state_not:
          - awaiting_matter
          - expired
          - unknown
          - unavailable
          - waiting
        - condition: state
          entity: sensor.bapsim_observation_issue_status
          state_not:
          - disconnected
          - alert_requested
          - unknown
          - unavailable
          - not_observed
        card:
          type: grid
          title: 선택한 안내 처리
          columns: 2
          square: false
          cards:
          - type: button
            name: 선택한 안내 재알림 보류
            icon: mdi:check-decagram
            tap_action:
              action: perform-action
              perform_action: bapsim.dashboard_control
              data:
                action: acknowledge
          - type: button
            name: 안부 확인 중
            icon: mdi:account-search
            tap_action:
              action: perform-action
              perform_action: bapsim.respond
              data:
                response: checking
          - type: button
            name: 안부 확인 완료
            icon: mdi:check-circle
            tap_action:
              action: perform-action
              perform_action: bapsim.respond
              data:
                response: resolved
      - type: markdown
        content: '{% set result = states(''sensor.bapsim_notification_control_result'')
          %}

          {% if result in [''accepted'', ''rejected'', ''failed'', ''submitted'', ''applying'']
          %}

          ### 최근 알림 조작 결과

          {% if result == ''accepted'' %}

          **적용됨** · {{ {''acknowledge'':''선택한 안내 재알림 보류'', ''pause_lifestyle'':''생활
          변화 알림 쉬기'', ''cancel_pause'':''알림 쉬기 취소''}.get(state_attr(''sensor.bapsim_notification_control_result'',
          ''action''), ''알림 조작'') }}

          {% elif result == ''submitted'' or result == ''applying'' %}

          **처리 중** · 저장 또는 적용 결과를 기다리고 있습니다.

          {% else %}

          **적용되지 않음** · {{ state_attr(''sensor.bapsim_notification_control_result'',
          ''reason'') or ''조작 조건을 다시 확인해 주세요.'' }}

          {% endif %}

          {% set recorded_at = state_attr(''sensor.bapsim_notification_control_result'',
          ''recorded_at'') %}

          {% if recorded_at %}화면 갱신: {{ as_timestamp(recorded_at) | timestamp_custom(''%m월
          %d일 %H:%M'', true) }}{% endif %}

          {% else %}

          알림 조작 이력이 없습니다.

          {% endif %}

          '
      - type: horizontal-stack
        cards:
        - type: button
          name: 외출 기간 알림 쉬기
          icon: mdi:bell-sleep
          tap_action:
            action: navigate
            navigation_path: /bapsim-lab/pause
        - type: button
          name: 상세 진단
          icon: mdi:information-outline
          tap_action:
            action: navigate
            navigation_path: /bapsim-lab/diagnostics
    subview: true
    back_path: /bapsim-lab/status
