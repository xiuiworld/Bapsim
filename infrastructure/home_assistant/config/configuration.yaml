default_config:

bapsim:

homeassistant:
  name: Bapsim Lab
  time_zone: Asia/Seoul
  packages: !include_dir_named packages

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

recorder:
  purge_keep_days: 14
  include:
    entities:
      - input_select.bapsim_lid_state
      - input_select.bapsim_cooking_state
      - input_select.bapsim_availability
      - input_select.bapsim_away_state
      - sensor.bapsim_detection_status
      - sensor.bapsim_workflow_status
      - sensor.bapsim_decline_status
      - sensor.bapsim_decline_detection
      - sensor.bapsim_interval_detection
      - sensor.bapsim_baseline
      - sensor.bapsim_features
      - sensor.bapsim_notification_delivery
      - sensor.bapsim_notification_controls
      - sensor.bapsim_notification_control_result
      - sensor.bapsim_output_state
      - sensor.bapsim_simulation_output_state
      - sensor.bapsim_simulation_baseline
      - sensor.bapsim_simulation_features
      - sensor.bapsim_simulation_detection_status
      - sensor.bapsim_simulation_workflow_status
      - sensor.bapsim_simulation_notification_delivery
      - sensor.bapsim_mqtt_output
      - sensor.bapsim_auxiliary_deferral
      - sensor.bapsim_matter_input
      - sensor.bapsim_a05_connection_test

lovelace:
  mode: storage
  dashboards:
    bapsim-lab:
      mode: yaml
      title: 밥심
      icon: mdi:rice
      show_in_sidebar: true
      filename: dashboards/bapsim_lab.yaml
